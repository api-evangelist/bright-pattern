- aid: bright-pattern-list-management-v3-2
  name: Bright Pattern List Management API v3.2
  description: Manage outbound calling campaigns, calling lists, Do Not Call lists and campaign link groups
    from third-party applications — the current major version of the List Management API, with campaign
    start/stop, dispositions, caller IDs, team assignment and record-level fetch, add, update, erase and
    delete.
  humanURL: https://help.brightpattern.com/latest:Api
  baseURL: https://{tenant}.brightpattern.com/configapi/v3
