  name: Bright Pattern Regular Call Recordings API
  description: >-
    These methods enable retrieval of regular voice recordings (i.e., recordings where voices of all participating
    parties are recorded in the same audio file) and the related call metadata. Both audio files and metadata
    can be retrieved immediately upon call termination. Parameters required for recording identificaiton
    can be obtained via scenario variables $(item.globalInteractionId) and $(item.interactionStepId).

    Regular call recordings are exported in GSM format.
