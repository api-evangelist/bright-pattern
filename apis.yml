- aid: bright-pattern:bright-pattern-multichannel-call-recordings-api
  name: Bright Pattern Multichannel Call Recordings API
  description: "These methods are used to extract individual segments of multichannel call recordings\
    \ (i.e., recordings where voice of each paricipating party is recorded into a separate audio file).\n\
    \nThe Get Multichannel Recording Structure method should be used first to obtain the Interaction IDs,\
    \ Party IDs, and optionally segments, to be used in the subsequent Get Multichannel Recording Segment\
    \ Audio File requests.\n\nSegments of multichannel recordings are available for export immediately\
    \ upon call termination. \n\nSegments of multichannel recordings are exported in uncompressed PCM\
    \ format for maximun speech quality. Note that because of the large  size of multichannel PCM recording\
    \ files, they are typically stored in the system for a limited amount of time. Check with your service\
    \ provider about your limits, and consider overnight export of selected recordings for the previous\
    \ working day."
