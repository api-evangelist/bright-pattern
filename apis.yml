- aid: bright-pattern-mobile-web-messaging-v2
  name: Bright Pattern Mobile/Web Messaging API v2
  description: Customer-facing chat, voice and video messaging API used to build mobile and web messaging
    experiences against a Bright Pattern tenant — availability checks, chat requests, event streams, file
    upload, agent profile photos, ICE servers for WebRTC, case history and mobile push notification subscription.
    Backs the iOS and Android Mobile SDKs.
  humanURL: https://help.brightpattern.com/latest:Mobile-SDK-Instruction-Manual/About
