- aid: bright-pattern-task-routing
  name: Bright Pattern Task Routing API
  description: Enables external systems such as CRMs to create, route, modify, cancel and query tasks
    in Bright Pattern Contact Center, associating each task with a case and a contact and supporting external
    identifiers so records are not duplicated across systems.
