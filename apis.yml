apis:
- aid: bright-pattern-configuration
  name: Bright Pattern Configuration API
  description: Automate user provisioning and read contact-center configuration from third-party systems.
    Create, read, update, delete and unlock users; list teams; and read the phone directory and access
    numbers on a Bright Pattern tenant.
  humanURL: https://help.brightpattern.com/latest:Api
  baseURL: https://{tenant}.brightpattern.com/configapi/v2
  tags:
  - Configuration
  - Users
  - Provisioning
  properties:
  - type: OpenAPI
    url: openapi/bright-pattern-configuration-openapi.yml
  - type: Postman
    url: https://documenter.getpostman.com/view/6711197/S1EUtanN
- aid: bright-pattern-scim-user-provisioning
  name: Bright Pattern SCIM-Compliant User Provisioning API
  description: SCIM 2.0 compliant user provisioning endpoint for communicating user identity data between
    an identity provider and Bright Pattern Contact Center, supporting create, get, replace, patch, delete
    and filtered lookup of users.
  humanURL: https://help.brightpattern.com/latest:Api
  baseURL: https://{tenant}.brightpattern.com/configapi/v2/scim
  tags:
