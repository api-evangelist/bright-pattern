- aid: bright-pattern:bright-pattern-authentication-api
  name: Bright Pattern Authentication API
  description: >-
    The OAuth 2.0 Client Credentials Grant is used to authenticate clients of this API. The authenticated
    user is checked for having appropriate privileges to perform the requested operation. The complete
    list of privileges can be found here. Privileges are assigned to users via one or more Roles.


    To obtain an access token:


    Login to your BPCC configuraiton portal.


    Navigate to Users page.


    Select or create a user with privileges corresponding to the tasks you wish to perform via the BPCC
    Configuraiton API.


    Click the Generate button to generate an API secret key. Copy the generated key and note the username
    for the next steps.


    Use the Get Access Token method to obtain an access token. Set the client_id to the username and client_secret
    to the generated API secrect key.


    Use the value of access_token returned in the response to set the Authorization: Bearer [access token]
    header of each subsequent request made via the BPCC Configuraiton API.
