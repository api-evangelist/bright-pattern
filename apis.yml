- aid: bright-pattern:bright-pattern-sms-mms-messaging-api
  name: Bright Pattern SMS/MMS Messaging API
  description: >-
    These methods enable sending of SMS and MMS messages and checking the delivery status. The response
    parameters are explained below.


    Response parameters


    Parameter

    Description


    tenant_id

    Unique identifier of your contact center in BPCC configuraiton.


    api_version

    API version.


    body

    Text of the message.


    num_segments

    Number of segments in the transmitted message. Messages exceeding 160 characters are transmitted in
    multiple segements. In the current verison of API this parameters is always set to 1.


    num_media

    Number of media files in the MMS message.


    date_created

    Timestamp of the original Send Message request.


    date_sent

    Timestamp of message transmission. Set to "null" in responses to Send Message requests. Set to actual
    time when the message was sent in responses to Get Message requests.


    date_updated

    Reserved.


    direction

    Always set to outboound-api.


    error_code

    Error code.


    error_message

    Error message.


    from

    Origin number or, if a messenger integration is being used, the messenger type and integration ID.


    price

    Reserved. In the current version of the API always set to null.


    sid

    Unique identifier of the message. Retured in response to a Send Message request and can be used in
    Get Message to check the delivery status of the message.


    status

    Status of message delivery. Possible values: queued (message queued to be sent), sent (message sent
    to SMS/MMS service provider but delivery not confirmed), delivered (message confirmed by SMS service
    provider to be delivered; currently not available for MMS), failed (message could not be sent; typically
    more details will be provided in error_message). Note that a 200 OK response to a Send Message request
    will always have status set to queued. Actual status of message delivery can be verified using the
    Get Message method with a slight delay.


    to

    Destination number or, if a messenger integration is being used, the messenger type and the messenger
    ID of the recipient.


    uri

    Reserved.
