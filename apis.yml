aid: bright-pattern
name: Bright Pattern
description: 'Bright Pattern is a cloud contact center (CCaaS) software company whose omnichannel platform
  routes voice, IVR, email, chat, SMS/MMS, video and social messenger conversations to agents, with built-in
  quality management, workforce management, outbound dialing and AI/bot assistance. The platform is multi-tenant:
  every customer contact center runs on its own tenant hostname, and Bright Pattern exposes nine public
  REST API families against that tenant — Configuration, SCIM-compliant user provisioning, List Management
  (v2, v3.0, v3.2), Task Routing, SMS/MMS, Interaction Content (call recordings and metadata), Real-Time
  Statistics, and the Mobile/Web Messaging APIs (v1 and v2) that back the iOS and Android Mobile SDKs.
  The public API reference is published as Postman documenter collections linked from the Bright Pattern
  documentation wiki.'
image: https://www.brightpattern.com/wp-content/uploads/2025/02/Brightpattern-Homepage-Logo.png
