note: Bright Pattern ships two first-party mobile SDKs for the Mobile/Web Messaging API v2, both from
  the ServicePattern GitHub organization. There is no published server-side SDK (no npm, PyPI, Maven Central,
  NuGet, Go module, RubyGems, Packagist or crates.io package) for the REST APIs — server integrations
  are expected to call the REST endpoints directly using the published Postman collections.
