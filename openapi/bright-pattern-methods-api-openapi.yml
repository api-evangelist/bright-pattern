    post:
      operationId: mobileNotificationSubscription
      summary: Mobile Notification Subscription
      description: 'This method is a client application request for either subscribing to or canceling mobile notifications for a chat session.


        Notes


        This method should be invoked after invoking the Request Chat method (i.e., the chatId value required for this method is returned in the Request Chat method).


        Additionally, this method should be invoked when its device token is changed.


        The client application may also opt to stop receiving mobile notifications by using this API method

        with an empty JSON body: {}


        Request Parameters


        The mobile application will specify one of the following parameters, depending on the application’s

        operating system and used notification framework.


        Parameter Name

        Description


        ios_apns_device_token

        The iOS application using native APNs


        ios_app_bundle_id

        For iOS devices using native APNs, this parameter is required and is used as the APNs topic


        ios_firebase_device_token

        The iOS application using Firebase notifications


        android_firebase_device_token

        The android application using Firebase notifications


        Returns


        Code

        Description


        200

        Names of configured services with current status


        Errors


        Code

        Description


        403

        Forbidden


        406

        Not acceptable: Too many parameters/corresponding notifications are not configured for the Messaging/Chat entry'
      tags:
      - Methods
      parameters:
      - name: chatId
        in: path
        required: true
        schema:
          type: string
      - name: tenantUrl
        in: query
        required: false
        schema:
          type: string
      - name: User-Agent
        in: header
        required: false
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: string
            example: "// For Apple Push Notification service (APNs):\n{\n    \"ios_apns_device_token\": \"<iOS APNs device token>\",\n    \"ios_app_bundle_id\": \"<iOS app ID>\"\n}\n// For Apple Firebase:\n{\n    \"ios_firebase_device_token\": \"<Firebase token>\"\n}\n//For Android Firebase:\n{\n    \"android_firebase_device_token\": \"<Firebase token>\"\n}"
      responses:
        '200':
          description: Mobile Notification Subscription
          content:
            application/json:
              example: {}
      security:
      - bearerAuth: []
