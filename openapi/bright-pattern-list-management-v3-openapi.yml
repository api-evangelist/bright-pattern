  /configapi/v3/campaign/queryRecord/{campaign_id}:
    post:
      operationId: queryARecord
      summary: Query a Record
      description: "This method returns a copy of an existing record in an instance, as well as the information\
        \ about the last interaction associated with this record. The instance is specified by its unique\
        \ identifier, instanceID, returned in the response body of the Get Campaign method (see here).\
        \ Optionally, the user can view all request attempts made.\n\nThe search for the record is performed\
        \ based on the defined key fields. Before the record is queried, its existence in the specified\
        \ list is checked. If the record does exist in the specified list, the record is queried successfully.\n\
        \nNote: If a PHONE type field is defined as a key, the record value is checked for a full match\
        \ with the value stored in the database or the original source (if the data was modified upon\
        \ loading into the database).\n\nNote: The response body contains the List Record JSON Object,\
        \ defined by two sub-objects as follows:\n\nentry object: contains a copy of the list entry\n\n\
        field names are retained as defined at list creation\n\ncustom fields are returned with the prefix\
        \ 'custom_' added to the name defined in the Administrator Application\n\nstatusobject: contains\
        \ the campaign results for this specific record\n\nfield names are predefined\n\ncompleted field\
        \ is always present, while the other fields may be absent if the record was never called or never\
        \ reached an agent.\n\nattempts list: contains all of the request attempts made (if enabled)\n\
        \nNote: Time and date field values are returned in UTC format.\n\nInput parameters\n\nName\nType\n\
        Required?\nPossible/Default Values\n\ninstanceId\nstring\nyes (can be found in the Get Campaign\
        \  response)\n-\n\nfields\nlist of JSON Objects\nyes (specifies the key fields to be used for\
        \ the object search; the non-key fields are ignored)\n-\n\nextractAttempts\nboolean\nno (if true,the\
        \ method returns the list of all attempts)\nfalse (Default);  \ntrue\n\nResponse Codes\n\nCode\n\
        Description\n\n200\nSuccess\n\n400\nBad request (format not understood; 1 or more required fields\
        \ are missing or have an unsupported value)\n\n401\nAuthentication failed (invalid token format;\
        \ token is expired)\n\n403\nAuthentication succeeded but the user does not have sufficient privileges\n\
        \n404\nSpecified campaign was not found;  \nSpecified record was not found;  \nInvalid URL\n\n\
        409\nSpecified instance is not bound to the selected campaign"
      tags:
      - Campaigns
      parameters:
      - name: campaign_id
        in: path
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
            example:
              instanceId: DBA3A9B0-6CC4-11EE-807C-0800200C9A66
              extractAttempts: false
              fields:
                id: '1'
      responses:
        '200':
          description: 200 OK
          content:
            application/json:
              example:
                entry:
                  firstname: Firstname4
                  lastname: Lastname4
                  date_time: 29-12-2023
                  phone: '1004'
                  id: N4
                status:
                  globalInteractionID: ''
                  lastCallDuration: 0
                  lastDisposition: ''
                  totalAttempts: 0
                  completed: false
