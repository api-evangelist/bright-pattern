  /configapi/v3/callinglist/get/{list_id}/{campaign_id}:
    post:
      operationId: queryARecordDeprecated
      summary: Query a Record DEPRECATED
      description: "This method returns a copy of an existing record in a calling list of an associated\
        \ campaign.The search for the record is performed based on the defined key fields.\n\nNote: This\
        \ method was retained from the previous List Management API version and is not recommended for\
        \ usage. Instead, we recommend using the enhanced Campaigns - Query a Record  method.\n\nIf the\
        \ list has been added to the specified campaign more than once, the method returns an array of\
        \ records. If the list is not bound to any campaign, the record can still be queried by passing\
        \ any string, e.g. 'aaa' as campaign_id\n\nNote: The response body contains the List Record JSON\
        \ Object, defined by two sub-objects as follows:\n\nentry object: contains a copy of the list\
        \ entry\n\nfield names are retained as defined at list creation\n\nNote: This method doesn't return\
        \ custom fields\n\nstatusobject: contains the campaign results for this specific record\n\nfield\
        \ names are predefined\n\ncompleted field is always present, while the other fields may be absent\
        \ if the record was never called or never reached an agent\n\nNote: Time and date field values\
        \ are returned in UTC format.\n\nNote: If a PHONE type field is defined as a key, the record value\
        \ is checked for a full match with the value stored in the database or the original source (if\
        \ the data was modified upon loading into the database).\n\nNote: If the specified list is not\
        \ bound to the campaign, the method does not return the status object.\n\nResponse Codes\n\nCode\n\
        Description\n\n200\nSuccess\n\n400\nBad request (format not understood; 1 or more required fields\
        \ are missing or have an unsupported value)\n\n401\nAuthentication failed (invalid token format;\
        \ token is expired)\n\n403\nAuthentication succeeded but the user does not have sufficient privileges\n\
        \n404\nSpecified List was not found;  \nSpecified Record was not found;  \nInvalid URL"
      tags:
      - Lists
      parameters:
      - name: list_id
        in: path
        required: true
        schema:
          type: string
      - name: campaign_id
        in: path
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
            example:
              id: N4
      responses:
        '200':
          description: 0 instances - 200 OK
          content:
            application/json:
              example:
                entry:
                  firstname: Mike
                  phone: '16505555555'
                  id: '2'
                  lastname: Miller
                  status: Platinum
      security:
      - bearerAuth: []
  /configapi/v3/callinglist/getAll:
    post:
      operationId: getLists
      summary: Get Lists
      description: "This method returns all Calling Lists, sorted by the standard MongoDB _id field.\n\
        \nNote: To accommodate the display of large numbers of list records, Bright Pattern Contact Solution\
        \ utilizes Cursor-based pagination (see here). The _id field is used as the \"cursor\" to reference\
        \ the last served record.\n\nInput parameters\n\nName\nType\nRequired?\nPossible/Default Values\n\
        \nlimit\ninteger, ≤ 100\nyes (specifies the maximum size of the returned list)\n1...100\n\ncursor\n\
        string\nno (used for pagination)\nFirst request: null  \nSubsequent request: value received in\
        \ the response to the previous request\n\nResponse Codes\n\nCode\nDescription\n\n200\nSuccess\n\
        \n400\nBad request (format not understood; limit exceeded; 1 or more required fields are missing\
        \ or have an unsupported value)\n\n401\nAuthentication failed (invalid token format; token is\
        \ expired)\n\n403\nAuthentication succeeded but the user does not have sufficient privileges\n\
        \n404\nInvalid URL"
      tags:
      - Lists
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
            example:
              limit: 100
              cursor: 590e9abd4abbf1165862d342
      responses:
        '200':
          description: 200 OK
          content:
            application/json:
              example:
                next_cursor: 590e9abd4abbf1165862d342
                records:
                - id: 635DB66C-AA54-41C9-9F0E-AC3A9B5EDB2D
                  name: List 1.csv
                  formatId: 31002C90-7188-11EE-A565-0800200C9A66
                  formatName: format 1
                  creationDate: '2021-02-19T19:11:40.000'
                  totalRecords: 100
                - id: 635DB66C-AA54-41C9-9F0E-AC3A9B5EDB2D
                  name: List 2.csv
                  formatId: 31002C90-7188-11EE-A565-0800200C9A66
                  formatName: format 1
                  creationDate: '2021-02-19T19:11:41.000'
                  totalRecords: 100
      security:
      - bearerAuth: []
  /configapi/v3/callinglist/getList/{list_id}:
    get:
      operationId: getList
      summary: Get List
      description: "This method returns the information about a list, including its name, the format name,\
        \ and amount of records of the specified list. Additionally, it returns the information about\
        \ the associated campaign of that list, if any.\n\nResponse Codes\n\nCode\nDescription\n\n200\n\
        Success\n\n400\nBad request (wrong cursor; format not understood; 1 or more required fields are\
        \ missing or have an unsupported value)\n\n401\nAuthentication failed (invalid token format; token\
        \ is expired)\n\n403\nAuthentication succeeded but the user does not have sufficient privileges\n\
        \n404\nSpecified List was not found;  \nInvalid URL"
      tags:
      - Lists
      parameters:
      - name: list_id
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: 200 OK
          content:
            application/json:
              example:
                name: List 1.csv
                formatId: 31002C90-7188-11EE-A565-0800200C9A66
                formatName: format 1
                creationDate: '2021-02-19T19:11:40.000'
                totalRecords: 100
                campaigns:
                - campaignName: Campaign name 1
                  campaignId: 99B6B870-6CC5-11EE-807C-0800200C9A66
                  instanceId: 94D63B10-6CF1-11EE-807C-0800200C9A66
                - campaignName: Campaign name 1
                  campaignId: 99B6B870-6CC5-11EE-807C-0800200C9A66
                  instanceId: 9EA07CA0-6CF1-11EE-807C-0800200C9A66
                - campaignName: Campaign name 2
                  campaignId: 7E57DE70-6CF1-11EE-807C-0800200C9A66
                  instanceId: A5F55160-6CF1-11EE-807C-0800200C9A66
      security:
      - bearerAuth: []
  /configapi/v3/callinglist/deleteList/{list_id}:
    delete:
      operationId: deleteListAndOrphanedFormat
      summary: Delete List and Orphaned Format
      description: "This method deletes a list, archiving all records with associated campaign results\
        \ associated with that list. If the last list using a specific format was deleted, that format\
        \ is removed as well.\n\nNote: Bright Pattern Contact Center solution supports several voice campaign\
        \ modes (see here). Depending on the mode of the associated campaign, the active call behavior\
        \ will differentiate as follows:\n\nProgressive, Predictive, or Automatic (IVR) campaigns\nUpon\
        \ instance deletion, all active, i.e. in a dialing state, within a script, or connected to an\
        \ agent, calls are dropped\n\nPreview campaigns\nUpon instance deletion, only the calls not yet\
        \ picked up by an agent are dropped. In-progress and connected calls are not affected\n\nThe results\
        \ of completed calls are archived and available for downloading in the Contact Center Administrator\
        \ application (see here). Interaction results for dropped calls are not saved.\n\nResponse Codes\n\
        \nCode\nDescription\n\n200\nSuccess\n\n400\nBad request (format not understood; 1 or more required\
        \ fields are missing or have an unsupported value)\n\n401\nAuthentication failed (invalid token\
        \ format; token is expired)\n\n403\nAuthentication succeeded but the user does not have sufficient\
        \ privileges\n\n404\nSpecified List was not found;  \nInvalid URL"
      tags:
      - Lists
      parameters:
      - name: list_id
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: 200 OK
      security:
      - bearerAuth: []
  /configapi/v3/callinglist/createList:
    post:
      operationId: createList
      summary: Create List
      description: "This method creates a new empty list using an existing format. The format is specified\
        \ by its unique identifier, formatId, returned in the response body of the Get Lists method (see\
        \ here).\n\nInput parameters\n\nName\nType\nRequired?\nPossible/Default Values\n\nformatId\nstring\n\
        yes (can be found in the Get Lists  response)\n-\n\nResponse Codes\n\nCode\nDescription\n\n200\n\
        Success\n\n400\nBad request (format not understood; 1 or more required fields are missing or have\
        \ an unsupported value)\n\n401\nAuthentication failed (invalid token format; token is expired)\n\
        \n403\nAuthentication succeeded but the user does not have sufficient privileges\n\n404\nSpecified\
        \ Format was not found;  \nInvalid URL\n\n409\nDuplicate name error"
      tags:
      - Lists
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
            example:
              name: List 3.csv
              formatId: 31002C90-7188-11EE-A565-0800200C9A66
      responses:
        '200':
          description: 200 OK
          content:
            application/json:
              example:
                id: 635DB66C-AA54-41C9-9F0E-AC3A9B5EDB2D
      security:
      - bearerAuth: []
  /configapi/v3/callinglist/createListWithNewFormat:
    post:
      operationId: createListWithNewFormat
      summary: Create List with New Format
      description: "This method creates a new empty list and a new format corresponding to that list.\n\
        \nNote: By default, the newly created format will have the following settings, that cannot be\
        \ changed:\n\nInput file encoding is set to UTF-8\n\nNo header row is added to contain filed names\n\
        \nDelimiter is set to \"comma\" character\n\nWhen creating the new list format, the fields must\
        \ be defined with the following properties in mind:\n\nField Property\nDescription\n\nname (string)\n\
        Required property that defines field names. The names must be unique.  \nDefault value: -\n\n\
        type (string)\nRequired property that indicates the type of data the field contains.  \nNote:\
        \ See the table below for available data types.  \nDefault value: -\n\nrequired (boolean)\nOptional\
        \ property that indicates that the data in this field is required.  \nDefault value: false\n\n\
        searchable (boolean)\nOptional property that indicates that this field will be used for record\
        \ lookups.  \nDefault value: false\n\nskip (boolean)\nOptional property that indicates that the\
        \ data in this field is non-essential. Such data will not be included in Campaign Results/Archives,\
        \ returned in API requests, or imported into the database. However, including such fields in the\
        \ request body should not result in an error since the fields are simply ignored.  \nNote: Skipped\
        \ fields cannot be set as required, searchable, or key.  \nDefault value: false\n\nkey (boolean)\n\
        Optional property that indicates that this field will be used to identify list records uniquely.\
        \ The key will be used to detect duplicated and reference Campgin Results data.  \nDefault value:\
        \ false\n\nField types\n\nField Type\nDescription\n\nACCOUNT\nAccount type fields can be used\
        \ to store customer's unique identifiers. The values from such fields are stored in the Call History\
        \ and can be used for interaction record search.  \nNote: List formats can only have one field\
        \ of this type.\n\nAGENT_LOGIN_ID\nFields of this type are used to assign records to specific\
        \ agents in preview and progressive campaign modes.  \nNote: This field will be ignored if used\
        \ in predictive or automatic campaigns.\n\nCALLING_NUMBER\nFields of this type contain the numbers\
        \ to be displayed as caller IDs when dialing the corresponding records from campaigns.  \nNOTE:\
        \ Fields of this type are required to enable the From list field of type \"Caller ID\" caller\
        \ id assignment method.\n\nCOMPANY\nCompany type fields can be used to store the information about\
        \ the company the record belongs to, e.g. company name.\n\nDATETIME\nFields of this type can be\
        \ used to specify the date and time a callback request was made. Typically, such information is\
        \ provided in opt-in callback lists. Fields of this type have additional properties, timeZone\
        \ and format.  \n  \nSupported formats:  \nMM/dd/yyyy ::mm(Default);  \ndd.MM.yyyy HH:mm;  \n\
        yyyy-MM-dd HH:mm;  \nyyyy-MM-dd;  \ndd-MM-yyyy;  \nMM-dd-yyyy;  \nMM/dd/yyyy HH:mm:ss\n\nDATETIME_CALL_AT\n\
        Fields of this type can be used to specify the date and time the record should be called. Fields\
        \ of this type have additional properties, timeZone and format(see above for details about supported\
        \ formats).\n\nFIRST_NAME\nFields of this type store the first name of the contact.\n\nINTEGER\n\
        Integer type fields store semantically numeric data, e.g. age or account balance. Such fields\
        \ can be used to set campaign quotas.\n\nLAST_NAME\nFields of this type store the last name of\
        \ the contact.\n\nOTHER\nOther is used to specify that the field has a type different than the\
        \ predefined types outlined here.\n\nPHONE\nPhone type fields store the phone numbers to be dialed\
        \ during campaigns.  \nNote: Fields of this type have additional properties defined in the table\
        \ below.  \nNote: List formats must have at least one Phone field defined.\n\nZIP_CODE\nFields\
        \ of this type store the postal code of the contact.  \nNote: Fields of this type are required\
        \ to enable the Use safe calling hours setting.\n\nPRIORITY\nPriority type fields indicate that\
        \ the record must be attempted before the other records in the list. Fileds of this type  \nhave\
        \ additional properties:order,i.e. First-in-First-out or Last-in-FIrst-Out, andexpiresAfter,used\
        \ to set the expiration date of the priority setting.\n\nSTATE\nFields of this type store the\
        \ state the contact lives in.  \nNote: Fields of this or the ZIP_CODE type are required to enable\
        \ the Comply with State calling hours setting.\n\nPhone Type Properties\n\nName\nType\nRequired?\n\
        Possible/Default Values\n\nphoneType\nstring\nno\nOTHER (Default);  \nUS_CANADA\n\nremovePrefix\n\
        string\nno ( applicable only for phoneType = OTHER)\n-\n\ndefaultCoutryCode\nstring\nno (applicable\
        \ only for phoneType = OTHER)\n-\n\nInput parameters\n\nName\nType\nRequired?\nPossible/Default\
        \ Values\n\nformatName\nstring\nyes\n-\n\nfields\nlist of JSON Objects\nyes\n-\n\nlistName\nstring\n\
        no\n-; \"FORMAT: $(formatName)\"\n\nResponse Codes\n\nCode\nDescription\n\n200\nSuccess\n\n400\n\
        Bad request (format not understood; 1 or more required fields are missing or have an unsupported\
        \ value)\n\n401\nAuthentication failed (invalid token format; token is expired)\n\n403\nAuthentication\
        \ succeeded but the user does not have sufficient privileges\n\n404\nInvalid URL\n\n409\nDuplicate\
        \ name error"
      tags:
      - Lists
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
            example:
              formatName: format 1
              fields:
              - name: id
                type: OTHER
                required: true
                searchable: false
                skip: false
                key: false
              - name: phone
                type: PHONE
                required: true
                searchable: true
                skip: false
                key: true
                phoneType: OTHER
                removePrefix: ''
                defaultCountryCode: ''
              listName: List 1.csv
      responses:
        '200':
          description: 200 OK
          content:
            application/json:
              example:
                id: 635DB66C-AA54-41C9-9F0E-AC3A9B5EDB2D
                formatId: 31002C90-7188-11EE-A565-0800200C9A66
      security:
      - bearerAuth: []
  /configapi/v3/callinglist/addAll/{list_id}:
    post:
      operationId: addManyRecords
      summary: Add Many Records
      description: "This method adds multiple new records to a calling list and returns the number of\
        \ successfully added records.\n\nNote: Manipulating the content of calling lists requires the\
        \ user to have an additional \"Update content of calling list\" privilege.\n\nThis method catches\
        \ and displays the following errors (if any were encountered during the request execution):\n\n\
        limitExceeded - the maximum total number of rows across all existing lists has been reached\n\n\
        missingKey - one or more key field values were not found;\n\nduplicateKey - a record with the\
        \ same key already exists in the list;\n\nmissingRequired - one or more required fields are missing\
        \ values;\n\nformatError - format was mismatched in one or more field values (e.g. boolean value\
        \ was defined for an integer field); one or more unsupported fields were defined in the request\
        \ body\n\nNote: The type of error encountered is returned in the response body, along with the\
        \ list of objects that could not be added due to that error. The example provided below reflects\
        \ the response format of all of the described errors.\n\nResponse Codes\n\nCode\nDescription\n\
        \n200\nSuccess\n\n400\nBad request (format not understood; 1 or more required fields are missing\
        \ or have an unsupported value)\n\n401\nAuthentication failed (invalid token format; token is\
        \ expired)\n\n403\nAuthentication succeeded but the user does not have sufficient privileges\n\
        \n404\nSpecified List was not found;  \nInvalid URL"
      tags:
      - Lists
      parameters:
      - name: list_id
        in: path
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
            example:
            - firstname: Firstname4
              lastname: Lastname4
              date_time: 01-11-2023
              phone: '1004'
              id: N4
            - firstname: Firstname5
              lastname: Lastname5
              date_time: 12-11-2023
              phone: '10045'
              id: N5
      responses:
        '200':
          description: 200 OK
          content:
            application/json:
              example:
                added: 1
                error:
                  duplicateKey:
                  - firstname: Firstname2
                    lastname: Lastname2
                    date_time: 01-11-2023
                    phone: '1002'
                    id: N2
      security:
      - bearerAuth: []
  /configapi/v3/callinglist/add/{list_id}:
    post:
      operationId: addRecord
      summary: Add Record
      description: "This method adds a single new record to a calling list.\n\nBefore the record is added,\
        \ the uniqueness of its key values is checked against the contents of the list. If the list does\
        \ not already have a record with the specified key values, the new record is added successfully.\n\
        \nNote: Manipulating the content of calling lists requires the user to have an additional \"Update\
        \ content of calling list\" privilege.\n\nResponse Codes\n\nCode\nDescription\n\n200\nSuccess\n\
        \n400\nBad request (format not understood; 1 or more required fields are missing or have an unsupported\
        \ value)\n\n401\nAuthentication failed (invalid token format; token is expired)\n\n403\nAuthentication\
        \ succeeded but the user does not have sufficient privileges\n\n404\nSpecified List was not found;\
        \  \nInvalid URL\n\n409\nDuplicate key error"
      tags:
      - Lists
      parameters:
      - name: list_id
        in: path
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
            example:
              firstname: Firstname4
              lastname: Lastname4
              date_time: 01-11-2023
              phone: '1004'
              id: N4
      responses:
        '200':
          description: 200 OK
      security:
      - bearerAuth: []
  /configapi/v3/callinglist/updateAll/{list_id}:
    post:
      operationId: updateManyRecords
      summary: Update Many Records
      description: "This method updates fields in existing records of a calling list and returns the number\
        \ of successfully updated records. Additionally, this method can reset optional parameters to\
        \ their default values by passing \" \" or null to these parameters.\n\nNote: Manipulating the\
        \ content of calling lists requires the user to have an additional \"Update content of calling\
        \ list\" privilege.\n\nThis method catches and displays the following errors (if any were encountered\
        \ during the request execution):\n\nmissingKey - one or more key field values were not found;\n\
        \nkeyNotFound - a record with the same key already exists in the DNC list;\n\nformatError - format\
        \ was mismatched in one or more field values (e.g. string value was defined for an integer field);\
        \ one or more unsupported fields were defined in the request body\n\nNote: The type of error encountered\
        \ is returned in the response body, along with the list of objects that could not be updated due\
        \ to that error. The example provided below reflects the response format of all of the described\
        \ errors.\n\nThis method is similar to the Update Record method. However, the input parameters\
        \ differ to accommodate updating multiple records within one request. This is done to account\
        \ for the fact that each request requires reprocessing of the entire calling list.\n\nInput parameters\n\
        \nName\nType\nRequired?\nPossible/Default Values\n\nDNC List Record JSON Objects\nlist\nyes (only\
        \ the key fields are required)\n-\n\nResponse Codes\n\nCode\nDescription\n\n200\nSuccess\n\n400\n\
        Bad request (format not understood; 1 or more required fields are missing or have an unsupported\
        \ value)\n\n401\nAuthentication failed (invalid token format; token is expired)\n\n403\nAuthentication\
        \ succeeded but the user does not have sufficient privileges\n\n404\nSpecified List was not found;\
        \  \nInvalid URL"
      tags:
      - Lists
      parameters:
      - name: list_id
        in: path
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
            example:
            - id: N3
              phone: '1004'
            - id: N4
              phone: '1004'
      responses:
        '200':
          description: 200 OK
          content:
            application/json:
              example:
                updated: 1
                error:
                  keyNotFound:
                  - id: N4
                    phone: '1004'
      security:
      - bearerAuth: []
  /configapi/v3/callinglist/update/{list_id}:
    post:
      operationId: updateRecord
      summary: Update Record
      description: "This method updates fields in an existing record of a calling list. Additionally,\
        \ this method can reset an optional parameter to its default value by passing \" \" or null to\
        \ that parameter.\n\nNote: Manipulating the content of calling lists requires the user to have\
        \ an additional \"Update content of calling list\" privilege.\n\nThe search for the record is\
        \ performed based on the defined key fields. The request can contain either a full or partial\
        \ set of fields of the List Record JSON Object, but the key fields are mandatory and must be retained\
        \ as configured during list creation.\n\nBefore the record is queried, its existence in the specified\
        \ list is checked by its unique key values. If the record does exist in the specified list, the\
        \ record is updated successfully.\n\nNote: If a PHONE type field is defined as a key, the record\
        \ value is checked for a full match with the value stored in the database or the original source\
        \ (if the data was modified upon loading into the database).\n\nTo avoid disruptions in the campaign\
        \ work caused by the list reprocessing time, the Dialer ignores the changes made to the record\
        \ until it makes a call attempt to that record. Thus, if a list containing the updated record\
        \ has Filters or Sorting configured, the changes made to that record will not affect that filtering\
        \ or sorting order.\n\nNote: Always remember to reapply the desired Filters or Sorting settings\
        \ if you wish for it to reflect the changes made to the updated record.\n\nInput parameters\n\n\
        Name\nType\nRequired?\nPossible/Default Values\n\nDNC List Record JSON Object\nstring\nyes (can\
        \ provide either all or some fields; key fields are mandatory and must have a value)\n-\n\nResponse\
        \ Codes\n\nCode\nDescription\n\n200\nSuccess\n\n400\nBad request (format not understood; 1 or\
        \ more required fields are missing or have an unsupported value)\n\n401\nAuthentication failed\
        \ (invalid token format; token is expired)\n\n403\nAuthentication succeeded but the user does\
        \ not have sufficient privileges\n\n404\nSpecified List was not found;  \nSpecified Record was\
        \ not found;  \nInvalid URL"
      tags:
      - Lists
      parameters:
      - name: list_id
        in: path
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
            example:
              date_time: 01-11-2023
              phone: '1004'
      responses:
        '200':
          description: 200 OK
      security:
      - bearerAuth: []
  /configapi/v3/callinglist/erase/{list_id}:
    post:
      operationId: eraseRecord
      summary: Erase Record
      description: "This method removes a record from a list and all associated campaign results. The\
        \ search for the record is performed based on the defined key fields. An error is returned if\
        \ a record does not exist.\n\nNote: Manipulating the content of calling lists requires the user\
        \ to have an additional \"Update content of calling list\" privilege.\n\nBright Pattern Contact\
        \ Center solution supports several voice campaign modes (see here). If the last record is being\
        \ deleted, depending on the mode of the associated campaign, the active call behavior will differentiate\
        \ as follows:\n\nProgressive, Predictive, or Automatic (IVR) campaigns\n\nUpon instance deletion,\
        \ all active, i.e. in a dialing state, within a script, or connected to an agent, calls are dropped\n\
        \nPreview campaigns\n\nUpon instance deletion, only the calls not yet picked up by an agent are\
        \ dropped. In-progress and connected calls are not affected\n\nOtherwise, if there are still other\
        \ records in the list, the method won't impact any calls.\n\nNote: Erased records with completed\
        \ calls and their results are not archived. Interaction results for dropped calls are not saved.\n\
        \nNote: This method does not delete contacts, activities, voice recordings, transcriptions, or\
        \ screen recordings. This functionality is covered by other APIs.\n\nInput parameters\n\nName\n\
        Type\nRequired?\nPossible/Default Values\n\nfields\nstring\nyes (specifies the key fields to be\
        \ used for the object search; the non-key fields are ignored)\n-\n\nreason\nstring\nyes (used\
        \ to specify the reason for audit log purposes)\n-\n\nResponse Codes\n\nCode\nDescription\n\n\
        200\nSuccess\n\n400\nBad request (format not understood; 1 or more required fields are missing\
        \ or have an unsupported value)\n\n401\nAuthentication failed (invalid token format; token is\
        \ expired)\n\n403\nAuthentication succeeded but the user does not have sufficient privileges\n\
        \n404\nSpecified List was not found;  \nSpecified Record was not found;  \nInvalid URL"
      tags:
      - Lists
      parameters:
      - name: list_id
        in: path
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
            example:
              fields:
                phone: '1004'
              reason: for audit log
      responses:
        '200':
          description: 200 OK
      security:
      - bearerAuth: []
  /configapi/v3/callinglist/delete/{list_id}:
    post:
      operationId: deleteManyRecords
      summary: Delete Many Records
      description: "This method deletes records from a list.\n\nNote: Manipulating the content of calling\
        \ lists requires the user to have an additional \"Update content of calling list\" privilege.\n\
        \nUpon request, an asynchronous job is created with a unique id. The id is returned in the response,\
        \ along with the estimated completion time.\n\nThe job id can be further used to check on the\
        \ deletion progress. For more information, refer to Get Job Status method description.\n\nNote:\
        \ The method processes one record deletion job at a time per specified list. We recommend that\
        \ you check the status of the existing record deletion job before initiating another one.\n\n\
        Records are searched for by one or many criteria defined in correspondence with the associated\
        \ list fields. At least one of the available filtering criteria has to be specified. Otherwise,\
        \ no record is deleted.\n\nThe method supports filtering records by:\n\nkey and searchable fields\
        \ (defined in the fields.some_field parameter);\n\nstatus in the associated campaign (defined\
        \ in the byCampaignResult.policy parameter);\n\ncreation date (defined in the createdFrom and\
        \ createdTo parameters);\n\ncombination of the above\n\nNote: If several criteria are specified,\
        \ the record should match all of them\n\nNote: Filtered records will be deleted from all campaigns\
        \ the list is associated with.\n\nInput parameters\n\nName\nType\nRequired?\nPossible/Default\
        \ Values\n\nfields.some_field\nstring\nno (specifies the fields to be used for search; the field\
        \ must be searchable or key)\n-\n\nbyCampaignResult.campaignId\nstring\nno (specifies that the\
        \ records are to be filtered by their associated campaign; campaignId is required (can be found\
        \ in the Get List response)\n-\n\nbyCampaignResult.policy\nstring\nno (specifies that the records\
        \ are to be filtered by their state; if = ONLY_COMPLETED, both completed and expired records are\
        \ removed)\nALL (Default);  \nONLY_COMPLETED;  \nONLY_NEVER_ATTEMPTED;\n\ncreatedFrom\ntime (UTC)\n\
        no (allows filtering by creation date; must be less than createdTo, if configured)\n-\n\ncreatedTo\n\
        time (UTC)\nno (allows filtering by creation date; must be more than createdFrom, if configured)\n\
        -\n\nResponse Codes\n\nCode\nDescription\n\n200\nSuccess\n\n400\nBad request (format not understood;\
        \ 1 or more required fields are missing or have an unsupported value)\n\n401\nAuthentication failed\
        \ (invalid token format; token is expired)\n\n403\nAuthentication succeeded but the user does\
        \ not have sufficient privileges\n\n404\nSpecified List was not found;  \nSpecified Campaign was\
        \ not found;  \nInvalid URL\n\n409\nList is not bound to specified Campaign;  \nRecord deletion\
        \ job is already in progress for the specified List"
      tags:
      - Lists
      parameters:
      - name: list_id
        in: path
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
            example:
              fields:
                accountId:
                - id1
                - id2
                - id3
              byCampaignResult:
                campaignId: 85389D39-E05C-4CE7-B36D-4401BEA52E14
                policy: ALL
              createdFrom: '2023-01-01T00:00:00.000'
              createdTo: '2023-01-10T00:00:00.000'
      responses:
        '200':
          description: 200 OK
          content:
            application/json:
              example: '{

                "job": "664f86eb65d0ccc8a05042d0",

                "estimated_time": 38 // in seconds

                }'
      security:
      - bearerAuth: []
  /configapi/v3/callinglist/deleteAll/{list_id}:
    post:
      operationId: deleteAllRecords
      summary: Delete All Records
      description: "This method removes all records from a list.\n\nNote: Manipulating the content of\
        \ calling lists requires the user to have an additional \"Update content of calling list\" privilege.\n\
        \nUpon request, an asynchronous job is created with a unique id. The id is returned in the response,\
        \ along with the estimated completion time.\n\nThe job id can be further used to check on the\
        \ deletion progress. For more information, refer to Get Job Status method description.\n\nNote:\
        \ The method processes one record deletion job at a time per specified list. We recommend that\
        \ you check the status of the existing record deletion job before initiating another one.\n\n\
        Bright Pattern Contact Center solution supports several voice campaign modes (see here). Depending\
        \ on the mode of the associated campaign, the active call behavior will differentiate as follows:\n\
        \nProgressive, Predictive, or Automatic (IVR) campaigns\n\nUpon instance deletion, all active,\
        \ i.e. in a dialing state, within a script, or connected to an agent, calls are dropped\n\nPreview\
        \ campaigns\n\nUpon instance deletion, only the calls not yet picked up by an agent are dropped.\
        \ In-progress and connected calls are not affected\n\nThe list of deleted records with completed\
        \ calls, as well as their results, are archived and available for downloading in the Contact Center\
        \ Administrator application (see here). Interaction results for dropped calls are not saved.\n\
        \nResponse Codes\n\nCode\nDescription\n\n200\nSuccess\n\n400\nBad request (format not understood;\
        \ 1 or more required fields are missing or have an unsupported value)\n\n401\nAuthentication failed\
        \ (invalid token format; token is expired)\n\n403\nAuthentication succeeded but the user does\
        \ not have sufficient privileges\n\n404\nSpecified List was not found;  \nSpecified Campaign was\
        \ not found;  \nInvalid URL\n\n409\nList is not bound to specified Campaign;  \nRecord deletion\
        \ job is already in progress for the specified List"
      tags:
      - Lists
      parameters:
      - name: list_id
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: 200 OK
          content:
            application/json:
              example: '{

                "job": "664f86eb65d0ccc8a05046d0",

                "estimated_time": 7 // in seconds

                }'
      security:
      - bearerAuth: []
  /configapi/v3/job/{job_id}:
    get:
      operationId: getJobStatus
      summary: Get Job Status
      description: 'This method returns the status of the record deletion job, requested in Delete Many
        Records or Delete All Records methods. The job is referenced in the path variable by its unique
        identifier, returned in the response body of the above methods.


        Depending on the status of the record deletion job, the following parameters are retuned in the
        response body:


        completion_percentage: calculated as the current number of succesfully deleted records over the
        total number of records to be deleted (multiplied by 100)


        returned always


        job_complete: status of the record deletion job, i.e. complete, processing, or failed


        returned always


        error_message: reason why the record deletion job could not be comleted


        returned if the job was failed ( job_complete= failed)


        deleted: the total number of successfully deleted records


        retuned if the job was completed ( job_complete= complete)


        Response Codes


        Code

        Description


        200

        Success


        400

        Bad request (format not understood; 1 or more required fields are missing or have an unsupported
        value)


        401

        Authentication failed (invalid token format; token is expired)


        403

        Authentication succeeded but the user does not have sufficient privileges


        404

        Specified Job was not found'
      tags:
      - Lists
      parameters:
      - name: job_id
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: '200 OK: Job Processing'
          content:
            application/json:
              example:
                completion_percentage: 31
                job_complete: processing
      security:
      - bearerAuth: []
  /configapi/v3/donotcalllist/deleteAll/{do_not_call_list_id}:
    post:
      operationId: deleteAllRecordsDNCLists
      summary: Delete All Records
      description: "This method deletes all records from a DNC List and returns the number of deleted\
        \ records.\n\nResponse Codes\n\nCode\nDescription\n\n200\nSuccess\n\n400\nBad request (format\
        \ not understood; 1 or more required fields are missing or have an unsupported value)\n\n401\n\
        Authentication failed (invalid token format; token is expired)\n\n403\nAuthentication succeeded\
        \ but the user does not have sufficient privileges;  \nModification of this type of list is not\
        \ allowed\n\n404\nSpecified DNC List was not found;  \nInvalid URL"
      tags:
      - DNC Lists
      parameters:
      - name: do_not_call_list_id
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: 200 OK
          content:
            application/json:
              example:
                deleted: 2
      security:
      - bearerAuth: []
  /configapi/v3/donotcalllist/delete/{do_not_call_list_id}:
    post:
      operationId: deleteManyRecordsDNCLists
      summary: Delete Many Records
      description: "This method deletes a collection of records from the selected DNC List and returns\
        \ the number of successfully deleted records. Records to be deleted are specified by the key field\
        \ value.\n\nAdditionally, this method catches and displays the following errors (if any were encountered\
        \ during the request execution):\n\nmissingKey - one or more key field values were not found;\n\
        \nformatError - format was mismatched in one or more field values (e.g. boolean value was defined\
        \ for a string field)\n\nNote: The type of error encountered is returned in the response body,\
        \ along with the list of objects that could not be deleted due to that error. The example provided\
        \ below reflects the response format of all of the described errors.\n\nInput parameters\n\nName\n\
        Type\nRequired?\nPossible/Default Values\n\nDNC List Record JSON Objects\nlist\nyes (only the\
        \ key field values are required to be defined)\n-\n\nResponse Codes\n\nCode\nDescription\n\n200\n\
        Success\n\n400\nBad request (format not understood; 1 or more required fields are missing or have\
        \ an unsupported value)\n\n401\nAuthentication failed (invalid token format; token is expired)\n\
        \n403\nAuthentication succeeded but the user does not have sufficient privileges;  \nModification\
        \ of this type of list is not allowed\n\n404\nSpecified DNC List was not found;  \nInvalid URL"
      tags:
      - DNC Lists
      parameters:
      - name: do_not_call_list_id
        in: path
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
            example:
            - key: '9999999'
            - key: '8888888'
      responses:
        '200':
          description: 200 OK
          content:
            application/json:
              example:
                deleted: 1
                error:
                  keyNotFound:
                  - key: '9999999'
      security:
      - bearerAuth: []
  /configapi/v3/donotcalllist/addAll/{do_not_call_list_id}:
    post:
      operationId: addManyRecordsDNCLists
      summary: Add Many Records
      description: "This method adds new records to a DNC List and returns the number of successfully\
        \ added (i.e., appended) records.\n\nRecords to be added are defined with the fields of the corresponding\
        \ DNC List Record JSON Object (see here). Duplicate records, i.e. records with the same value\
        \ in the key field as an already added record, are ignored.\n\nAdditionally, this method catches\
        \ and displays the following errors (if any were encountered during the request execution):\n\n\
        missingKey - one or more key field values were not found;\n\nduplicateKey - a record with the\
        \ same key already exists in the DNC list;\n\nformatError - format was mismatched in one or more\
        \ field values (e.g. string value was defined for an integer field); one or more unsupported fields\
        \ were defined in the request body\n\nNote: The type of error encountered is returned in the response\
        \ body, along with the list of objects that could not be added due to that error. The example\
        \ provided below reflects the response format of all of the described errors.\n\nInput parameters\n\
        \nName\nType\nRequired?\nPossible/Default Values\n\nDNC List Record JSON Objects\nlist\nyes (all\
        \ fields from the corresponding JSON Object are required to be defined; the key field must have\
        \ a value, the comment field can be empty)\n-\n\nResponse Codes\n\nCode\nDescription\n\n200\n\
        Success\n\n400\nBad request (format not understood; 1 or more required fields are missing or have\
        \ an unsupported value)\n\n401\nAuthentication failed (invalid token format; token is expired)\n\
        \n403\nAuthentication succeeded but the user does not have sufficient privileges;  \nModification\
        \ of this type of list is not allowed\n\n404\nSpecified DNC List was not found;  \nInvalid URL"
      tags:
      - DNC Lists
      parameters:
      - name: do_not_call_list_id
        in: path
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
            example:
            - key: '9999999'
              comment: optional comment
            - key: '8888888'
      responses:
        '200':
          description: 200 OK
          content:
            application/json:
              example:
                added: 1
                error:
                  duplicateKey:
                  - key: '8888888'
      security:
      - bearerAuth: []
  /configapi/v3/donotcalllist/add/{do_not_call_list_id}:
    post:
      operationId: addRecordsDeprecated
      summary: Add Records DEPRECATED
      description: "This method adds new records to a DNC List and returns the number of successfully\
        \ added (i.e., appended) records.\n\nNote: This method was retained from the previous List Management\
        \ API version and is not recommended for usage. Instead, we recommend using the enhanced Add Many\
        \ Records method.\n\nRecords to be added are defined by listing out values corresponding to the\
        \ fields of the target DNC List. Duplicate records, i.e. records with the same values as an already\
        \ added record, are ignored.\n\nInput parameters\n\nName\nType\nRequired?\nPossible/Default Values\n\
        \nNew Record(s)\nstring\nyes (values corresponding to the fields of the target DNC list are required;\
        \ \"optional comment\" value must be added if the target DNC list has a comment field)\n-\n\n\
        Response Codes\n\nCode\nDescription\n\n200\nSuccess\n\n400\nBad request (format not understood;\
        \ 1 or more required fields are missing or have an unsupported value)\n\n401\nAuthentication failed\
        \ (invalid token format; token is expired)\n\n403\nAuthentication succeeded but the user does\
        \ not have sufficient privileges;  \nModification of this type of list is not allowed\n\n404\n\
        Specified DNC List was not found;  \nInvalid URL"
      tags:
      - DNC Lists
      parameters:
      - name: do_not_call_list_id
        in: path
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
            example:
            - - '123456789'
              - optional comment
            - - '9999999999'
              - optional comment
      responses:
        '200':
          description: 200 OK
          content:
            application/json:
              example:
                added: 2
      security:
      - bearerAuth: []
  /configapi/v3/donotcalllist/replaceAll/{do_not_call_list_id}:
    post:
      operationId: replaceRecordsDeprecated
      summary: Replace Records DEPRECATED
      description: "This method deletes all records in a DNC List, replacing them with new ones, and returns\
        \ the number of successfully added (i.e., appended) new records.\n\nNote: This method was retained\
        \ from the previous List Management API version and is not recommended for usage. Instead, we\
        \ recommend using the combination of enhanced Delete All Records and Add Many Records methods.\n\
        \nRecords to be added are defined by listing out values corresponding to the fields of the target\
        \ DNC List. Duplicate records, i.e. records with the same values as an already added record, are\
        \ ignored.\n\nResponse Codes\n\nCode\nDescription\n\n200\nSuccess\n\n400\nBad request (format\
        \ not understood; 1 or more required fields are missing or have an unsupported value)\n\n401\n\
        Authentication failed (invalid token format; token is expired)\n\n403\nAuthentication succeeded\
        \ but the user does not have sufficient privileges;  \nModification of this type of list is not\
        \ allowed\n\n404\nSpecified DNC List was not found;  \nInvalid URL"
      tags:
      - DNC Lists
      parameters:
      - name: do_not_call_list_id
        in: path
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
            example:
            - - '123456789'
              - optional comment
            - - '9999999999'
              - optional comment
      responses:
        '200':
          description: 200 OK
          content:
            application/json:
              example:
                added: 2
      security:
      - bearerAuth: []
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: 'OAuth 2.0 access token issued by the Bright Pattern token endpoint, sent as `Authorization:
        Bearer <token>`.'
    oauth2ClientCredentials:
      type: oauth2
      description: OAuth 2.0 client-credentials grant against the Bright Pattern tenant token endpoint.
      flows:
        clientCredentials:
          tokenUrl: https://{tenant_url}/configapi/v3/oauth/token
          scopes: {}
security:
- bearerAuth: []
