  /clientweb/api/v2/casehistory:
    get:
      operationId: getCaseHistory
      summary: Get Case History
      description: 'This method returns the combined transcripts of all chat sessions (i.e., the chat
        thread) linked to the specific CRM case object. Note that this request should be made only after
        the chat_session_case_set server event is received; if the scenario has not specified a case,
        the request will return an error.


        Returns


        Code

        Description


        200

        Success: application/json


        Errors


        Code

        Description


        403

        Forbidden


        404

        Not found


        406

        Not acceptable: If the scenario did not specify a case'
      tags:
      - Methods
      parameters:
      - name: tenantUrl
        in: query
        required: false
        schema:
          type: string
      - name: User
        in: header
        required: false
        schema:
          type: string
      responses:
        '200':
          description: Get Case History
          content:
            application/json:
              example: "{\r\n    \"sessions\": [\r\n        {\r\n            \"chat_id\":\"<session 1\
                \ ID>\",\r\n            \"created_time\":<Unix timestamp in seconds>,\r\n            \"\
                events\":<array of events from this chat session>\r\n        },\r\n        ...\r\n   \
                \     {\r\n            \"chat_id\":\"<session 4 ID>\",\r\n            \"created_time\"\
                :<Unix timestamp in seconds>,\r\n            \"events\":<array of events from this chat\
                \ session>\r\n        },\r\n        ...     \r\n    ]\r\n}"
      security:
      - bearerAuth: []
  /clientweb/api/v2/closecase:
    post:
      operationId: closeCase
      summary: Close Case
      description: 'This method invokes a client application request to close the case associated with
        the chat session. Note that this request should be made only after the chat_session_case_set server
        event is received; if the scenario has not specified a case, the request will return an error.


        Returns


        Code

        Description


        200

        Case successfully closed


        Errors


        Code

        Description


        403

        Forbidden


        404

        Not found


        406

        Not acceptable: If scenario did not specify a case


        500

        Server error: Case is specified but cannot be closed (i.e., the CRM server responded with an error)'
      tags:
      - Methods
      parameters:
      - name: tenantUrl
        in: query
        required: false
        schema:
          type: string
      - name: User-Agent
        in: header
        required: false
        schema:
          type: string
      responses:
        '200':
          description: Close Case
          content:
            application/json:
              example: {}
      security:
      - bearerAuth: []
  /clientweb/api/v2/version:
    get:
      operationId: getVersion
      summary: Get Version
      description: 'This method returns the Bright Pattern Contact Center software version of the server.
        It may be used for informational purposes (e.g., adding the version number to the bottom of an
        application window or in an informational dialog window, as well as seeing the server version
        in the client application logs). Note that this method is not available in the Mobile/Web Messaging
        API v1.


        Returns


        Code

        Description


        200

        OK: success


        Errors


        Code

        Description


        404

        Not found: For example, if the existing Mobile/Web Messaging API v1 endpoint is called instead
        of the v2 endpoint'
      tags:
      - Methods
      parameters:
      - name: tenantUrl
        in: query
        required: false
        schema:
          type: string
      - name: User-Agent
        in: header
        required: false
        schema:
          type: string
      responses:
        '200':
          description: Get Version
          content:
            application/json:
              example:
                server_version: 5.5.6.12345 (Stable)
      security:
      - bearerAuth: []
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
