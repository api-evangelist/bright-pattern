  /clientweb/api/v2/files:
    post:
      operationId: uploadFile
      summary: Upload File
      description: 'This method uploads a file to the server. The maximum file size is 25 MB. The server
        will store up to 1000 files. Newly received files will replace the oldest files. This method can
        be used, for example, to send pictures from the client mobile application to the contact center
        agents.


        Returns


        Code

        Description


        200

        File ID to be used in the chat_session_file message (content type: application/json)


        Errors


        Code

        Description


        400

        Bad Request


        403

        Forbidden'
      tags:
      - Methods
      parameters:
      - name: tenantUrl
        in: query
        required: false
        schema:
          type: string
      - name: User-Agent
        in: header
        required: false
        schema:
          type: string
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
      responses:
        '200':
          description: Upload File Example
          content:
            application/json:
              example:
                file_id: file ID to use in chat_session_file message
      security:
      - bearerAuth: []
