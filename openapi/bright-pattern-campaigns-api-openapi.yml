  /configapi/v3/campaign/getUpdatedRecords/{campaign_id}:
    servers:
    - url: https://{tenant_url}
      description: Bright Pattern is multi-tenant; the base host is the customer contact-center tenant domain.
      variables:
        tenant_url:
          default: example.brightpattern.com
          description: Your Bright Pattern Contact Center tenant hostname.
    post:
      operationId: getUpdatedRecords
      summary: Get Updated Records
      description: "This method returns a list of all updated records within an instance. The instance is specified by its unique identifier, instanceID, returned in the response body of the Get Campaign method. Optionally, the user can view request attempts and specify the time frame for which they want to display the updated records list. The records are returned and sorted by the last date attempted (MongoDB lastDate field).\n\nNote: To accommodate the display of large numbers of list records, Bright Pattern Contact Solution utilizes Cursor-based pagination (see here). The _id and the lastDatefields are concatenated and used as the \"cursor\" to reference the last served record.\n\nNote: The input parameters defined for this method in the List Management API 3.0 differ from the previous version.\n\nInput parameters\n\nName\nType\nRequired?\nPossible/Default Values\n\ninstanceId\nstring\nyes (can be found in the Get Campaign  response)\n-\n\nstartTime\ntime (UTC)\nno (if specified, the method returns all records completed at or after the startTime)\n-\n\nendTime\ntime (UTC)\nno (if specified, the method returns all records completed before the endTime)\n-\n\nextractAttempts\nboolean\nno (if true,the method returns the list of all attempts)\nfalse (Default);  \ntrue\n\nlimit\ninteger, ≤ 1000\nyes (Specifies the maximum number of records per page when using cursor-based pagination)\n1...1000\n\ncursor\nstring\nno (mn for pagination)\nFirst request: null  \nSubsequent request:  \nvalue received in the response to the previous request\n\nResponse Codes\n\nCode\nDescription\n\n200\nSuccess\n\n400\nBad request (format not understood; 1 or more required fields are missing or have an unsupported value)\n\n401\nAuthentication failed (invalid token format; token is expired)\n\n403\nAuthentication succeeded but the user does not have sufficient privileges\n\n404\nSpecified campaign was not found;  \nInvalid URL\n\n409\nSpecified instance is not bound to the selected campaign"
      tags:
      - Campaigns
      parameters:
      - name: campaign_id
        in: path
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
            example:
              instanceId: DBA3A9B0-6CC4-11EE-807C-0800200C9A66
              startTime: '2023-01-01T00:00:00.000'
              endTime: '2023-01-30T00:00:00.000'
              extractAttempts: true
              limit: 1000
              cursor: 2023-01-10T12:13:59.001_590e9abd4abbf1165862d342
      responses:
        '200':
          description: Updated
          content:
            application/json:
              example: "{\n    \"next_cursor\": \"2023-01-15T18:13:59.111_6870e9abd4abbf1165862d22\",\n    \"records\": [\n        {\n            \"entry\": {\n                \"firstname\": \"Firstname2\",\n                \"date_time\": \"01-12-2023\",\n                \"phone\": \"1002\",\n                \"id\": \"N2\",\n                \"lastname\": \"Lastname2\"\n            },\n            \"status\": {\n                \"globalInteractionID\": \"F944CE77-2B21-472F-BE85-8BDE356A9500\",\n                \"lastCallDuration\": 30,\n                \"lastDisposition\": \"Appointment approved\",\n                \"totalAttempts\": 1,\n                \"completed\": true,\n                \"completedTime\": \"2023-01-19T20:46:35.000\",\n                \"lastAgent\": \"katie.kent\",\n                \"lastPhone\": \"1002\",\n                \"lastDate\": \"2023-01-19T20:46:35.000\",\n                \"custom_field_1\": \"value1\",\n                \"custom_field_2\": \"value2\"\n            },\n            \"attempts\": [\n                           {\n                                \"call_attempted\": true,\n                                \"disposition\": \"Appointment approved\",\n                                \"date\": \"2023-01-19T20:46:35.000\",\n                                \"phone\": \"1003\",\n                                \"phoneTimezone\": \"Europe/Dublin\", //Dialer 2.5\n                                \"postalCodeTimezone\": \"\", //Dialer 2.5\n                                \"timezonesBy\": \"field\", //Dialer 2.5                       \n                                \"callDuration\": 30,\n                                \"dialingDuration\": 5,\n                                \"callNotes\": \"\",\n                                \"agent\": \"katie.kent\",\n                                \"globalInteractionID\": \"F944CE77-2B21-472F-BE85-8BDE356A9500\",\n                                \"CPADuration\": 2,\n                                \"CPAResult\": \"Voice\",\n                                \"custom_field_1\": \"value1\",\n                                \"custom_field_2\": \"value2\"\n                            }\n            ]\n        }\n    ]\n}"
      security:
      - bearerAuth: []
  /configapi/v3/campaign/queryRecord/{campaign_id}:
    servers:
    - url: https://{tenant_url}
      description: Bright Pattern is multi-tenant; the base host is the customer contact-center tenant domain.
      variables:
        tenant_url:
          default: example.brightpattern.com
          description: Your Bright Pattern Contact Center tenant hostname.
    post:
      operationId: queryARecord
      summary: Query a Record
      description: "This method returns a copy of an existing record in an instance, as well as the information about the last interaction associated with this record. The instance is specified by its unique identifier, instanceID, returned in the response body of the Get Campaign method (see here). The search for the record is performed based on the defined key fields.\n\nBefore the record is queried, its existence in the specified list is checked. If the record does exist in the specified list, the record is queried successfully.\n\nNote: If a PHONE type field is defined as a key, the record value is checked for a full match with the value stored in the database or the original source (if the data was modified upon loading into the database).\n\nNote: The response body contains the List Record JSON Object, defined by two sub-objects as follows:\n\nentry object: contains a copy of the list entry\nfield names are retained as defined at list creation\ncustom fields are returned with the prefix 'custom_' added to the name defined in the Administrator Application\n\ntime and date field values are returned in UTC format\n\nstatusobject: contains the campaign results for this specific record\nomitted if the list is not assigned to the campaign or the campaign doesn't exist\n\nfield names are predefined\n\ncompleted field is always present, while the other fields may be absent if the record was never called or never reached an agent.\n\nInput parameters\n\nName\nType\nRequired?\nPossible/Default Values\n\ninstanceId\nstring\nyes (can be found in the Get Campaign  response)\n-\n\nfields\nlist of JSON Objects\nyes (specifies the key fields to be used for the object search; the non-key fields are ignored)\n-\n\nextractAttempts\nboolean\nno (if true,the method returns the list of all attempts)\nfalse (Default);  \ntrue\n\nResponse Codes\n\nCode\nDescription\n\n200\nSuccess\n\n400\nBad request (format not understood; 1 or more required fields are missing or have an unsupported value)\n\n401\nAuthentication failed (invalid token format; token is expired)\n\n403\nAuthentication succeeded but the user does not have sufficient privileges\n\n404\nSpecified campaign was not found;  \nSpecified record was not found;  \nInvalid URL\n\n409\nSpecified instance is not bound to the selected campaign"
      tags:
      - Campaigns
      parameters:
      - name: campaign_id
        in: path
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
            example:
              instanceId: DBA3A9B0-6CC4-11EE-807C-0800200C9A66
              extractAttempts: false
              fields:
                id: '1'
      responses:
        '200':
          description: 200 OK
          content:
            application/json:
              example:
                entry:
                  firstname: Firstname4
                  date_time: 29-12-2023
                  phone: '1004'
                  id: N4
                  lastname: Lastname4
                status:
                  globalInteractionID: ''
                  lastCallDuration: 0
                  lastDisposition: ''
                  totalAttempts: 0
                  completed: false
                  completedTime: ''
                  lastAgent: ''
                  lastPhone: ''
                  lastDate: ''
                  custom_field_1: ''
                  custom_field_2: ''
      security:
      - bearerAuth: []
  /configapi/v3/campaign/deleteCampaign/{campaign_id}:
    servers:
    - url: https://{tenant_url}
      description: Bright Pattern is multi-tenant; the base host is the customer contact-center tenant domain.
      variables:
        tenant_url:
          default: example.brightpattern.com
          description: Your Bright Pattern Contact Center tenant hostname.
    delete:
      operationId: deleteCampaign
      summary: Delete Campaign
      description: "This method deletes the campaign and erases call results, including all archived results for the campaign.\n\nNote: This method is not supported for Outbound Messaging campaigns.\n\nDepending on the mode of the associated campaign, the active call behavior will differentiate as follows:\n\nProgressive, Predictive, or Automatic (IVR) campaigns: Upon instance deletion, all active, i.e. in a dialing state, within a script, or connected to an agent, calls are dropped.\n\nPreview campaigns: Upon instance deletion, only the calls not yet picked up by an agent are dropped. In-progress and connected calls are not affected.\n\nResponse Codes\n\nCode\nDescription\n\n200\nSuccess\n\n400\nBad request (format not understood; 1 or more required fields are missing or have an unsupported value)\n\n401\nAuthentication failed (invalid token format; token is expired)\n\n403\nAuthentication succeeded but the user does not have sufficient privileges\n\n404\nSpecified campaign was not found;  \nInvalid URL\n\n422\nNot supported for Outbound Messaging campaigns"
      tags:
      - Campaigns
      parameters:
      - name: campaign_id
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: 200 OK
      security:
      - bearerAuth: []
  /configapi/v3/campaign/unlinkCampaign/{campaign_id}:
    servers:
    - url: https://{tenant_url}
      description: Bright Pattern is multi-tenant; the base host is the customer contact-center tenant domain.
      variables:
        tenant_url:
          default: example.brightpattern.com
          description: Your Bright Pattern Contact Center tenant hostname.
    post:
      operationId: unlinkACampaign
      summary: Unlink a Campaign
      description: "This method removes the selected campaign from its link group. Once deleted, the group becomes re-ordered.\n\nNote: This method is not supported for Outbound Messaging campaigns.\n\nResponse Codes\n\nCode\nDescription\n\n200\nSuccess\n\n400\nBad request (format not understood; 1 or more required fields are missing or have an unsupported value)\n\n401\nAuthentication failed (invalid token format; token is expired)\n\n403\nAuthentication succeeded but the user does not have sufficient privileges\n\n404\nSpecified link group was not found;  \nSpecified campaign was not found;  \nInvalid URL\n\n409\nSpecified campaign is not linked to the selected link group\n\n422\nNot supported for Outbound Messaging campaigns"
      tags:
      - Campaigns
      parameters:
      - name: campaign_id
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: 200 OK
      security:
      - bearerAuth: []
  /configapi/v3/campaign/linkCampaign/{campaign_id}:
    servers:
    - url: https://{tenant_url}
      description: Bright Pattern is multi-tenant; the base host is the customer contact-center tenant domain.
      variables:
        tenant_url:
          default: example.brightpattern.com
          description: Your Bright Pattern Contact Center tenant hostname.
    post:
      operationId: linkACampaign
      summary: Link a Campaign
      description: "This method adds a campaign to the selected link group or changes its order. When adding, this will reset campaign type, teams assigned, hours, additional skills, and term to the settings of campaigns already in the group. Also call quota will be disabled. Once added, the group becomes re-ordered.\n\nNote: This method is not supported for Outbound Messaging campaigns.\n\nInput parameters\n\nName\nType\nRequired?\nPossible/Default Values\n\ngroupId\nstring\nyes\n-\n\nstartAfterCampaignId\nstring\nno\n- (will be added first, if empty)\n\nResponse Codes\n\nCode\nDescription\n\n200\nSuccess\n\n400\nBad request (format not understood; 1 or more required fields are missing or have an unsupported value)\n\n401\nAuthentication failed (invalid token format; token is expired)\n\n403\nAuthentication succeeded but the user does not have sufficient privileges\n\n404\nSpecified link group was not found;  \nSpecifed campaign was not found;  \nInvalid URL\n\n422\nNot supported for Outbound Messaging campaigns"
      tags:
      - Campaigns
      parameters:
      - name: campaign_id
        in: path
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
            example:
              groupId: 6D7C2A7E-7E7A-4D43-9F6D-AB7D6F2B1F1E
              startAfterCampaignId: 48B91DC5-A8CD-4FCA-9AF8-EC20A4ACC14B
      responses:
        '200':
          description: 200 OK
      security:
      - bearerAuth: []
  /configapi/v3/campaign/updateDisposition/{campaign_id}:
    servers:
    - url: https://{tenant_url}
      description: Bright Pattern is multi-tenant; the base host is the customer contact-center tenant domain.
