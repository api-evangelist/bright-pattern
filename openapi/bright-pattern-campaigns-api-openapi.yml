      parameters:
      - name: campaign_id
        in: path
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
            example:
              dispositions:
              - scope:
                  preview: false
                  outbound: true
                  inbound: false
                folder: Final
                orderNumber: 0
                name: Product sold
                description: The business purpose ...
                code: null
                type: SUCCESS
                agentCanSelect: true
                agentCanReschedule: false
              - scope:
                  preview: false
                  outbound: true
                  inbound: false
                folder: Non-final
                orderNumber: 15
