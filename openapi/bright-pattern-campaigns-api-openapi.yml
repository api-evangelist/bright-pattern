      - bearerAuth: []
  /configapi/v3/campaign/deleteDispositions/{campaign_id}:
    servers:
    - url: https://{tenant_url}
      description: Bright Pattern is multi-tenant; the base host is the customer contact-center tenant domain.
      variables:
        tenant_url:
          default: example.brightpattern.com
          description: Your Bright Pattern Contact Center tenant hostname.
    post:
      operationId: deleteDispositions
      summary: Delete Dispositions
      description: "This method deletes multiple custom dispositions from the campaign by matching the provided identifiers. The disposition IDs can be obtained using the Get Campaign method with ?include=dispositions (see here).\n\nNote: This method is not supported for Outbound Messaging campaigns.\n\nThis method catches and displays the following errors (if any were encountered during the request execution):\n\nidsNotFound - dispositions were not found or not associated with the selected campaign;\n\nisSystem - system dispositions (cannot be deleted);\n\nResponse Codes\n\nCode\nDescription\n\n200\nSuccess\n\n400\nBad request (format not understood; 1 or more required fields are missing or have an unsupported value)\n\n401\nAuthentication failed (invalid token format; token is expired)\n\n403\nAuthentication succeeded but the user does not have sufficient privileges\n\n404\nSpecified campaign was not found;  \nInvalid URL\n\n422\nNot supported for Outbound Messaging campaigns"
      tags:
      - Campaigns
      parameters:
      - name: campaign_id
        in: path
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
            example:
              dispositions:
              - 0758F19D-448E-4EE3-B34F-DF5014D1156E
              - A9B7ED52-CD95-48E1-BCB1-0754214309BF
      responses:
        '200':
          description: 200 OK
          content:
            application/json:
              example:
                removed: 1
                error:
                  idsNotFound:
                    ids:
                    - '111'
                  isSystem:
                    ids:
                    - A9B7ED52-CD95-48E1-BCB1-0754214309BF
      security:
      - bearerAuth: []
  /configapi/v3/campaign/addDisposition/{campaign_id}:
    servers:
    - url: https://{tenant_url}
      description: Bright Pattern is multi-tenant; the base host is the customer contact-center tenant domain.
