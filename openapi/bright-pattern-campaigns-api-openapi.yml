        Note: To accommodate the display of large numbers of list records, Bright Pattern Contact Solution utilizes Cursor-based pagination (see here). The _id and the lastDatefields are concatenated and used as the "cursor" to reference the last served record.


        Note: The input parameters defined for this method in the List Management API 3.0 differ from the previous version.


        Input parameters


        Name

        Type

        Required?

