      operationId: deleteCampaign
      summary: Delete Campaign
      description: 'This method deletes the campaign and erases call results, including all archived results for the campaign.


        Note: This method is not supported for Outbound Messaging campaigns.


        Depending on the mode of the associated campaign, the active call behavior will differentiate as follows:


        Progressive, Predictive, or Automatic (IVR) campaigns: Upon instance deletion, all active, i.e. in a dialing state, within a script, or connected to an agent, calls are dropped.


        Preview campaigns: Upon instance deletion, only the calls not yet picked up by an agent are dropped. In-progress and connected calls are not affected.


