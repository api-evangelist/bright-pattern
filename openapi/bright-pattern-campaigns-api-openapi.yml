                  minWaitMin: 1440
                  rescheduleMin: null
                  scenarioId: null
      responses:
        '200':
          description: 200 OK
          content:
            application/json:
              example:
                added: 0
                error:
                  duplicateName:
                  - scope:
                      preview: false
                      outbound: true
                      inbound: false
                    folder: Non-final
                    orderNumber: 15
                    name: Wrong person
                    description: The business purpose ...
                    code: null
                    type: CONTINUE
                    agentCanSelect: true
                    agentCanReschedule: true
                    dialRule:
                      action: WAIT
                      doRetry: false
                      maxRetries: null
                      retryIntervalMin: null
                      minWaitMin: 1440
