          description: Your Bright Pattern Contact Center tenant hostname.
    patch:
      operationId: updateDisposition
      summary: Update Disposition
      description: "This method updates the selected disposition and associated dial rule by its id (both custom and system).\n\nNote: This method is not supported for Outbound Messaging campaigns.\n\nSee Add Disposition format.\n\nResponse Codes\n\nCode\nDescription\n\n200\nSuccess\n\n400\nBad request (format not understood; 1 or more required fields are missing or have an unsupported value)\n\n401\nAuthentication failed (invalid token format; token is expired)\n\n403\nAuthentication succeeded but the user does not have sufficient privileges\n\n404\nSpecified campaign was not found;  \nSpecified disposition id was not found;  \nInvalid URL\n\n409\nSpecified disposition id is not associated with the selected campaign\n\n422\nNot supported for Outbound Messaging campaigns"
      tags:
      - Campaigns
      parameters:
      - name: campaign_id
        in: path
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
