    post:
      operationId: addDisposition
      summary: Add Disposition
      description: "This method add a disposition to the campaign.\n\nNote: This method is not supported for Outbound Messaging campaigns.\n\nInput parameters\n\nName\nType\nRequired?\nPossible/Default Values\n\nscope.outbound\nboolean\nno\ntrue (Default);  \nfalse\n\nscope.inbound\nboolean\nno\nfalse (Default);  \ntrue\n\nscope.preview\nboolean\nno\nfalse (Default);  \ntrue\n\nfolder\nstring\nyes\nFolder name for grouping\n\norderNumber\ninteger\nno\nDefault: last + 1\n\nname\nstring\nyes\nDisposition label shown to users\n\ndescription\nstring\nno\n-\n\ncode\nstring or null\nno\nExternal code used in scenarios; if provided, must be a string\n\ntype\nstring (enum)\nno\nSUCCESS (Default);  \nFAILURE;  \nCONTINUE;  \nDO_NOT_CALL\n\nagentCanSelect\nboolean\nno\ntrue(Default);  \nfalse\n\nagentCanReschedule\nboolean\nno\nfalse (Default);  \ntrue\n\ndialRule.action\nstring (enum) or null\nno\nDial rule action:  \nWAIT(Default);  \nRESCHEDULE;  \nSCENARIO;  \nSTOP_NUMBER;  \nSTOP_RECORD;  \nSTOP_NUMBER_ALL;  \nnull\n\ndialRule.doRetry\nboolean\nno\nfalse (Default);  \ntrue\n\ndialRule.maxRetries\ninteger or null\nno\n[1..2147483647],  \nDefault: 1\n\ndialRule.retryIntervalMin\ninteger or null\nno\n[0..10] minutes,  \nDefault: 10\n\ndialRule.minWaitMin\ninteger or null\nno\n[2..2147483647] minutes,  \nDefault: 1440\n\ndialRule.rescheduleMin\ninteger or null\nno\n[2..2147483647] minutes,  \nDefault: 1440\n\ndialRule.scenarioId\nstring (UUID) or null\nyes, when action=SCENARIO\nScenario to start after this disposition\n\nResponse Codes\n\nCode\nDescription\n\n200\nSuccess\n\n400\nBad request (format not understood; 1 or more required fields are missing or have an unsupported value)\n\n401\nAuthentication failed (invalid token format; token is expired)\n\n403\nAuthentication succeeded but the user does not have sufficient privileges\n\n404\nSpecified campaign was not found;  \nInvalid URL\n\n422\nNot supported for Outbound Messaging campaigns"
      tags:
      - Campaigns
      parameters:
      - name: campaign_id
        in: path
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
            example:
              scope:
                preview: false
                outbound: true
                inbound: false
              folder: Non-final
              orderNumber: 15
              name: Wrong person
              description: The business purpose ...
              code: null
              type: CONTINUE
              agentCanSelect: true
              agentCanReschedule: true
              dialRule:
                action: WAIT
                doRetry: false
                maxRetries: null
                retryIntervalMin: null
                minWaitMin: 1440
                rescheduleMin: null
                scenarioId: null
      responses:
        '200':
          description: 200 OK
      security:
      - bearerAuth: []
  /configapi/v3/campaign/addDispositions/{campaign_id}:
    servers:
    - url: https://{tenant_url}
