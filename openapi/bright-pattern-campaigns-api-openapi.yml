            schema:
              type: object
            example:
              id: 0758F19D-448E-4EE3-B34F-DF5014D1156E
              scope:
                preview: false
                outbound: true
                inbound: false
              folder: Non-final
              orderNumber: 15
              name: Wrong person
              description: The business purpose ...
              code: null
              type: CONTINUE
              agentCanSelect: true
              agentCanReschedule: true
              dialRule:
                action: WAIT
                doRetry: false
                maxRetries: null
                retryIntervalMin: null
                minWaitMin: 1440
                rescheduleMin: null
                scenarioId: null
      responses:
        '200':
          description: 200 OK
