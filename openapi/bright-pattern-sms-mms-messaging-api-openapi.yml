openapi: 3.2.0
info:
  title: BPCC SMS/MMS SMS/MMS Messaging API
  version: 1.0.0
  description: The SMS/MMS API allows external applications to send messages using text-capable access numbers of the Bright Pattern platform and through supported messenger integrations.
  contact:
    name: Bright Pattern
    url: https://www.brightpattern.com/contact/
  x-origin:
  - format: postman
    url: https://documenter.getpostman.com/view/6711197/S1ETRbny
    version: '2.1'
  x-evidence:
    fetched: '2026-08-08'
    source: https://documenter.gw.postman.com/api/collections/6711197/S1ETRbny?segregateAuth=true&versionTag=latest
    http_status: 200
    method: derived-from-published-postman-collection
    note: Mechanically converted from the Postman collection Bright Pattern publishes as its public API reference. No operations, paths, parameters or examples were invented.
servers:
- url: https://{tenant_url}
  description: Bright Pattern is multi-tenant; the base host is the customer contact-center tenant domain.
  variables:
    tenant_url:
      default: example.brightpattern.com
      description: Your Bright Pattern Contact Center tenant hostname.
security:
- bearerAuth: []
tags:
- name: SMS/MMS Messaging
  description: These methods enable sending of SMS and MMS messages and checking the delivery status.
paths:
  /clientweb/smsapi/v1/Messages:
    post:
      operationId: sendMessage
      summary: Send Message
      description: 'Sends an SMS, MMS, or messenger integration message to the designated recipient.


        Parameters


        Parameter

        Description


        To

        Destination number or recipient identifier. Mandatory.

        - For messages via SMS or MMS: the destination number in E.164 format.

        - For messages via a messenger integration: the destination expressed in the format :, for example viber:Akj8ntzD7CVmB3Q7V2JqSB== or whatsapp:5552223456


        From

        Origin number or messenger integration ID. Mandatory.

        - For messages via SMS or MMS: Must be specified in E.164 format. The number must be configured in BPCC as an access number of Text Out type. If you intend to process possible replies, this number must also be specified as an SMS/MMS access number for the messaging scenario entry that directs such replies to a chat service. Alphanumeric Sender IDs are not currently supported.

        - For messages via a messenger integration: the origin integration expressed in the format :, for example whatsapp:76BD05F0-FB19-4C3A-BA7C-30150B8D9826 or viber:3A07AE4D-6D3E-4AA7-8417-0EE6B34824C9.


        Body

        Text of the message to be sent. Mandatory for SMS (text-only) or messenger integration messages. Optional for MMS messages if the MediaURLs parameter is defined (see below). SMS and MMS messages longer than 160 characters will be segmented for transmission.


        MediaURLs

        An array of URLs for the media files to be sent in the MMS message. Optional and applies only to messages sent via MMS. May contain up to 10 items.'
      tags:
      - SMS/MMS Messaging
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
            example:
              To: '+5219843111460'
              Body: Sending a test message for BPCC SMS-MMS API.
              From: '16502505674'
              MediaURLs:
              - https://www.leithcars.com/assets/shared/CustomHTMLFiles/Responsive/MRP/Ford/2017/Mustang/images/2017-Ford-Mustang-01.jpg
      responses:
        '200':
          description: Send MMS Message
          content:
            application/json:
              example:
                account_sid: 2B699762-370C-4F76-A684-A85B5F93DF84
                api_version: '1'
                body: Sending a test message for BPCC SMS-MMS API.
                num_segments: '1'
                num_media: '0'
                date_created: Wed, 06 Feb 2019 08:24:08 +0000
                date_sent: null
                date_updated: Wed, 06 Feb 2019 08:24:08 +0000
                direction: outbound-api
                error_code: null
                error_message: null
                from: '16502505674'
                price: null
                sid: cbbb47e2-23be-452f-9b81-4a1f69300051
                status: queued
                to: '16046496025'
                uri: /clientweb/smsapi/v1/Messages/cbbb47e2-23be-452f-9b81-4a1f69300051
      security:
      - bearerAuth: []
  /clientweb/smsapi/v1/Messages/{message_sid}:
    get:
      operationId: getMessage
      summary: Get Message
      description: 'Gets the current status of a previously sent SMS or MMS message. Depending on the time of the request, network conditions, etc., one of the following statuses may be returned: queued, sent, delivered, failed.'
      tags:
      - SMS/MMS Messaging
      parameters:
      - name: message_sid
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Get Status of Previously Sent Message
          content:
            application/json:
              example:
                account_sid: 2B699762-370C-4F76-A684-A85B5F93DF84
                api_version: '1'
                body: Sending a test message for BPCC SMS-MMS API.
                num_segments: '1'
                num_media: '0'
                date_created: Wed, 06 Feb 2019 08:24:08 +0000
                date_sent: Wed, 06 Feb 2019 08:24:08 +0000
                date_updated: Wed, 06 Feb 2019 08:24:08 +0000
                direction: outbound-api
                error_code: null
                error_message: null
                from: '16502505674'
                price: null
                sid: null
                status: delivered
                to: '16046496025'
                uri: /clientweb/smsapi/v1/Messages/cbbb47e2-23be-452f-9b81-4a1f69300051
      security:
      - bearerAuth: []
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: 'OAuth 2.0 access token issued by the Bright Pattern token endpoint, sent as `Authorization: Bearer <token>`.'
    oauth2ClientCredentials:
      type: oauth2
      description: OAuth 2.0 client-credentials grant against the Bright Pattern tenant token endpoint.
      flows:
        clientCredentials:
          tokenUrl: https://{tenant_url}/configapi/v2/oauth/token
          scopes: {}
