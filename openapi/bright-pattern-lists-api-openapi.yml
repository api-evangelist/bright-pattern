  /configapi/v3/callinglist/createList:
    servers:
    - url: https://{tenant_url}
      description: Bright Pattern is multi-tenant; the base host is the customer contact-center tenant domain.
      variables:
        tenant_url:
          default: example.brightpattern.com
          description: Your Bright Pattern Contact Center tenant hostname.
    post:
      operationId: createList
      summary: Create List
      description: "This method creates a new empty list using an existing format. The format is specified by its unique identifier, formatId, returned in the response body of the Get Lists method (see here).\n\nInput parameters\n\nName\nType\nRequired?\nPossible/Default Values\n\nformatId\nstring\nyes (can be found in the Get Lists  response)\n-\n\nResponse Codes\n\nCode\nDescription\n\n200\nSuccess\n\n400\nBad request (format not understood; 1 or more required fields are missing or have an unsupported value)\n\n401\nAuthentication failed (invalid token format; token is expired)\n\n403\nAuthentication succeeded but the user does not have sufficient privileges\n\n404\nSpecified Format was not found;  \nInvalid URL\n\n409\nDuplicate name error"
      tags:
      - Lists
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
            example:
              name: List 3.csv
              formatId: 31002C90-7188-11EE-A565-0800200C9A66
              allowUsingDefaultTimezone: true
              defaultTimezone: Europe/Dublin
      responses:
        '200':
          description: 200 OK
          content:
            application/json:
              example:
                id: 635DB66C-AA54-41C9-9F0E-AC3A9B5EDB2D
      security:
      - bearerAuth: []
  /configapi/v3/callinglist/createListWithNewFormat:
    servers:
    - url: https://{tenant_url}
      description: Bright Pattern is multi-tenant; the base host is the customer contact-center tenant domain.
      variables:
        tenant_url:
          default: example.brightpattern.com
          description: Your Bright Pattern Contact Center tenant hostname.
    post:
      operationId: createListWithNewFormat
      summary: Create List with New Format
      description: "This method creates a new empty list and a new format corresponding to that list.\n\nWhen creating the new list format, the fields must be defined with the following properties in mind:\n\nField Property\nDescription\n\nname (string)\nRequired property that defines field names. The names must be unique.  \nDefault value: -\n\ntype (string)\nRequired property that indicates the type of data the field contains.  \nNote: See the table below for available data types.  \nDefault value: -\n\nrequired (boolean)\nOptional property that indicates that the data in this field is required.  \nDefault value: false\n\nsearchable (boolean)\nOptional property that indicates that this field will be used for record lookups.  \nDefault value: false\n\nskip (boolean)\nOptional property that indicates that the data in this field is non-essential. Such data will not be included in Campaign Results/Archives, returned in API requests, or imported into the database. However, including such fields in the request body should not result in an error since the fields are simply ignored.  \nNote: Skipped fields cannot be set as required, searchable, or key.  \nDefault value: false\n\nkey (boolean)\nOptional property that indicates that this field will be used to identify list records uniquely. The key will be used to detect duplicated and reference Campgin Results data.  \nDefault value: false\n\nNote: The following properties are not used when the method is called: CUSTOM_DELIMITER(default 'COMMA' value is set), DEFAULT_ENCODING(default 'UTF-8' value is set), DELIMITER_TYPE, FORMAT_TYPE(default 'DELIMITED' value is set),NAMES_IN_FIRST_LINE, SOURCE_TYPE.\n\nField types\n\nField Type\nDescription\n\nACCOUNT\nAccount type fields can be used to store customer's unique identifiers. The values from such fields are stored in the Call History and can be used for interaction record search.  \nNote: List formats can only have one field of this type.\n\nAGENT_LOGIN_ID\nFields of this type are used to assign records to specific agents in preview and progressive campaign modes.  \nNote: This field will be ignored if used in predictive or automatic campaigns.\n\nCALLING_NUMBER\nFields of this type contain the numbers to be displayed as caller IDs when dialing the corresponding records from campaigns.  \nNOTE: Fields of this type are required to enable the From list field of type \"Caller ID\" caller id assignment method.\n\nCOMPANY\nCompany type fields can be used to store the information about a business/company the record belongs to, e.g. company name.\n\nDATETIME\nFields of this type can be used to specify the date and time a callback request was made. Typically, such information is provided in opt-in callback lists. Fields of this type have additional properties, timeZone and format.  \n  \nSupported formats:  \nMM/dd/yyyy ::mm(Default);  \ndd.MM.yyyy HH:mm;  \nyyyy-MM-dd HH:mm;  \nyyyy-MM-dd;  \ndd-MM-yyyy;  \nMM-dd-yyyy;  \nMM/dd/yyyy HH:mm:ss\n\nDATETIME_CALL_AT\nFields of this type can be used to specify the date and time the record should be called. Fields of this type have additional properties, timeZone and format(see above for details about supported formats).\n\nFIRST_NAME\nFields of this type store the first name of the contact.\n\nINTEGER\nInteger type fields store semantically numeric data, e.g. age or account balance. Such fields can be used to set campaign quotas.\n\nLAST_NAME\nFields of this type store the last name of the contact.\n\nOTHER\nOther is used to specify that the field has a type different than the predefined types outlined here.\n\nPHONE\nPhone type fields store the phone numbers to be dialed during campaigns.  \nNote: Fields of this type have additional properties defined in the table below.  \nNote: List formats must have at least one Phone field defined.\n\nZIP_CODE\nFields of this type store the postal code of the contact.  \nNote: Fields of this type are required to enable the Use safe calling hours setting.\n\nPRIORITY\nPriority type fields indicate that the record must be attempted before the other records in the list. Fileds of this type  \nhave additional properties:order,i.e. First-in-First-out or Last-in-FIrst-Out, andexpiresAfter,used to set the expiration date of the priority setting.\n\nSTATE\nFields of this type store the state the contact lives in.  \nNote: Fields of this or the ZIP_CODE type are required to enable the Comply with State calling hours setting.\n\nPhone Type Properties\n\nName\nType\nRequired?\nPossible/Default Values\n\nphoneType\nstring\nno (if =US_CANADA, sets hasCountryCode to true)\nOTHER (Default);  \nUS_CANADA\n\nremovePrefix\nstring\nyes ( ignore this field if phoneType = US_CANADA)\n-\n\ndefaultCoutryCode\nstring\nno (ignore this field if phoneType = US_CANADA)\n-\n\nInput parameters\n\nName\nType\nRequired?\nPossible/Default Values\n\nformatName\nstring\nyes\n-\n\nfields\nlist of JSON Objects\nyes\n-\n\nlistName\nstring\nno (appropriate list format must be defined by \"FORMAT: $(formatName)\")\n-\n\nResponse Codes\n\nCode\nDescription\n\n200\nSuccess\n\n400\nBad request (format not understood; 1 or more required fields are missing or have an unsupported value)\n\n401\nAuthentication failed (invalid token format; token is expired)\n\n403\nAuthentication succeeded but the user does not have sufficient privileges\n\n404\nInvalid URL\n\n409\nDuplicate name error"
      tags:
      - Lists
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
            example:
              formatName: format 1
              fields:
              - name: id
                type: OTHER
                required: true
                searchable: false
                skip: false
                key: false
              - name: timeZone
                type: TIMEZONE
                required: true
                searchable: false
                skip: false
                key: false
                default: false
              - name: phone
                type: PHONE
                required: true
                searchable: true
                skip: false
                key: true
                phoneType: OTHER
                removePrefix: ''
                defaultCountryCode: ''
                overrideTimezone: timeZone
              listName: List 3.csv
              allowUsingDefaultTimezone: true
              defaultTimezone: Europe/Dublin
      responses:
        '200':
          description: 200 OK
          content:
            application/json:
              example:
                id: 635DB66C-AA54-41C9-9F0E-AC3A9B5EDB2D
                formatId: 31002C90-7188-11EE-A565-0800200C9A66
      security:
      - bearerAuth: []
  /configapi/v3/callinglist/updateListProperties/{list_id}:
    servers:
    - url: https://{tenant_url}
      description: Bright Pattern is multi-tenant; the base host is the customer contact-center tenant domain.
      variables:
        tenant_url:
          default: example.brightpattern.com
          description: Your Bright Pattern Contact Center tenant hostname.
    patch:
      operationId: updateListProperties
      summary: Update List Properties
      description: "This method allows to change the name and the expiration settings of an existing calling list, specified in the path variable, list_id.\n\nInput parameters\n\nName\nType\nRequired?\nPossible/Default Values\n\nname\nstring, ≤ 255 characters  \n  \nNote: Calling list name must be unique within the contact center\nno\n-\n\nexpireRecords\nboolean\nno\nDefault = false\n\nexpirationPeriod\ninteger, [0, 365]  \n  \nNote: Specifies number of days since record was added to the Calling list, after which that records is considered expired by the Dialer\nrequired, if expireRecords = true\nDefault = 90 days\n\nexpirationMode\nFiled name to be set as \"key\" for records exclusion  \n  \nNote: Must contain a valid field from the available calling list formats.\nrequired, if expireRecords = true\n-“INSERTION”  \n-“DATE_FIELD”  \n  \nDefault = “INSERTION”\n\ndateField\nFiled name to be set as \"key\" for record expiration  \n  \nNote: Must contain a valid Date/time field from the available calling list formats.\nrequired, if expirationMode = “DATE_FIELD”\n-\n\nResponse Codes\n\nCode\nDescription\n\n200\nSuccess\n\n400\nBad request (format not understood; 1 or more required fields are missing or have an unsupported value)\n\n401\nAuthentication failed (invalid token format; token is expired)\n\n403\nAuthentication succeeded but the user does not have sufficient privileges\n\n404\nInvalid URL\n\n409\nDuplicate name error"
      tags:
      - Lists
      parameters:
      - name: list_id
        in: path
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
            example:
              name: Updated Calling List Name
              expireRecords: true
              expirationPeriod: 90
              expirationMode: INSERTION
      responses:
        '200':
          description: 200 OK
      security:
      - bearerAuth: []
  /configapi/v3/callinglist/addAll/{list_id}:
    servers:
    - url: https://{tenant_url}
      description: Bright Pattern is multi-tenant; the base host is the customer contact-center tenant domain.
      variables:
        tenant_url:
          default: example.brightpattern.com
          description: Your Bright Pattern Contact Center tenant hostname.
    post:
      operationId: addManyRecords
      summary: Add Many Records
      description: "This method updates fields in existing records of a calling list and returns the number of successfully updated records.\n\nNote: Manipulating the content of calling lists requires the user to have an additional \"Update content of calling list\" privilege.\n\nThis method catches and displays the following errors (if any were encountered during the request execution):\n\nlimitExceeded - the maximum total number of rows across all existing lists has been reached\n\nmissingKey - one or more key field values were not found;\n\nduplicateKey - a record with the same key already exists in the list;\n\nmissingRequired - one or more required fields are missing values;\n\nformatError - format was mismatched in one or more field values (e.g. string value was defined for an integer field); one or more unsupported fields were defined in the request body\n\nResponse Codes\n\nCode\nDescription\n\n200\nSuccess\n\n400\nBad request (format not understood; 1 or more required fields are missing or have an unsupported value)\n\n401\nAuthentication failed (invalid token format; token is expired)\n\n403\nAuthentication succeeded but the user does not have sufficient privilegesv\n\n404\nSpecified List was not found;  \nInvalid URL"
      tags:
      - Lists
      parameters:
      - name: list_id
        in: path
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
            example:
            - firstname: Firstname4
              date_time: 01-11-2023
              phone: '1004'
              id: N4
              lastname: Lastname4
            - firstname: Firstname5
              date_time: 12-11-2023
              phone: '10045'
              id: N5
              lastname: Lastname5
      responses:
        '200':
          description: 200 OK
          content:
            application/json:
              example:
                added: 1
                error:
                  duplicateKey:
                  - firstname: Firstname4
                    date_time: 01-11-2023
                    phone: '1004'
                    id: N4
                    lastname: Lastname4
      security:
      - bearerAuth: []
  /configapi/v3/callinglist/add/{list_id}:
