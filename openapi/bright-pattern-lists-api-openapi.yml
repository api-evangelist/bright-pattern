      description: 'This method returns a list of records from an existing calling list, specified in the path variable, list_id.


        Records are referenced by indexes, assigned to each record in the list in sequential order of insertion (beginning from 0). All records with an index greater than or equal to the requested record index, fromIndex, are returned in the response.


        Note: The returned recordset contains JSON objects sorted by the index field. List Record JSON Object contains:


        entry object: contains a copy of the list entry


        field names are retained as defined at list creation


        Note: This method doesn''t return custom fields


        Note: The value returned in the id field can be used to reference this record in further API requests.


        Input parameters


        Name

        Type

        Required?

        Possible/Default Values


        maxSize

        integer, ≤ 1000

        yes (Specifies the maximum number of records per page when using cursor-based pagination)

        1...1000


        fromIndex

        string

        yes (specifies initial record index, used for pagination)

        -


        Response Codes


        Code

        Description


        200

        Success


        400

        Bad request (format not understood; 1 or more required fields are missing or have an unsupported value)


        401

        Authentication failed (invalid token format; token is expired)


        403

        Authentication succeeded but the user does not have sufficient privileges


        404

        Specified List was not found;

        Invalid URL'
      tags:
      - Lists
      parameters:
      - name: list_id
        in: path
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
            example:
              fromIndex: 0
              maxSize: '100'
      responses:
        '200':
          description: 200 OK
          content:
            application/json:
              example: "[\n  {\n    \"entry\": {\n      \"firstname\": \"Graham\",\n      \"phone\": \"16509999999\",\n      \"id\": \"1\",\n      \"lastname\": \"Smith\",\n      \"status\": \"Gold\"\n    },\n    \"index\": 0,\n    },\n  {\n    \"entry\": {\n      \"firstname\": \"Mike\",\n      \"phone\": \"16507777777\",\n      \"id\": \"2\",\n      \"lastname\": \"Miller\",\n      \"status\": \"Platinum\"\n    },\n    \"index\": 1,\n    },\n  {\n    \"entry\": {\n      \"firstname\": \"Katrina\",\n      \"phone\": \"16505555555\",\n      \"id\": \"3\",\n      \"lastname\": \"Johnson\",\n      \"status\": \"Silver\"\n    },\n    \"index\": 2,\n    },\n  {\n    \"entry\": {\n      \"firstname\": \"Jenny\",\n      \"phone\": \"16502222222\",\n      \"id\": \"4\",\n      \"lastname\": \"Green\",\n      \"status\": \"Gold\"\n    },\n    \"index\": 3, \n    }\n  }\n]"
      security:
      - bearerAuth: []
    servers:
    - url: https://{tenant_url}
      description: Bright Pattern is multi-tenant; the base host is the customer contact-center tenant domain.
      variables:
        tenant_url:
          default: example.brightpattern.com
          description: Your Bright Pattern Contact Center tenant hostname.
