              example:
                entry:
                  firstname: Mike
                  phone: '16505555555'
                  id: '2'
                  lastname: Miller
                  status: Platinum
      security:
      - bearerAuth: []
    servers:
    - url: https://{tenant_url}
      description: Bright Pattern is multi-tenant; the base host is the customer contact-center tenant domain.
      variables:
        tenant_url:
          default: example.brightpattern.com
          description: Your Bright Pattern Contact Center tenant hostname.
  /configapi/v3/callinglist/getAll:
    post:
      operationId: getLists
      summary: Get Lists
      description: 'This method returns all Calling Lists, sorted by the standard MongoDB _id field.


        Note: To accommodate the display of large numbers of list records, Bright Pattern Contact Solution utilizes Cursor-based pagination (see here). The _id field is used as the "cursor" to reference the last served record.


        Input parameters


        Name

        Type

        Required?

        Possible/Default Values


        limit

        integer, ≤ 1000

        yes (Specifies the maximum number of records per page when using cursor-based pagination)

        1...1000


        cursor

        string

        no (used for pagination)

        First request: null

        Subsequent request: value received in the response to the previous request


        Response Codes


        Code

        Description


        200

        Success


        400

        Bad request (limit exceeded; format not understood; 1 or more required fields are missing or have an unsupported value)


        401

        Authentication failed (invalid token format; token is expired)


        403

        Authentication succeeded but the user does not have sufficient privileges


        404

        Invalid URL'
      tags:
      - Lists
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
            example:
              limit: 100
              cursor: 590e9abd4abbf1165862d342
      responses:
        '200':
          description: 200 OK
          content:
            application/json:
              example:
                next_cursor: 590e9abd4abbf1165862d342
                records:
                - id: 635DB66C-AA54-41C9-9F0E-AC3A9B5EDB2D
                  name: List 1.csv
                  formatId: 31002C90-7188-11EE-A565-0800200C9A66
                  formatName: format 1
                  allowUsingDefaultTimezone: true
                  defaultTimezone: Europe/Dublin
                  totalRecords: 100
                - id: 635DB66C-AA54-41C9-9F0E-AC3A9B5EDB2D
                  name: List 2.csv
                  formatId: 31002C90-7188-11EE-A565-0800200C9A66
                  formatName: format 1
                  allowUsingDefaultTimezone: false
                  totalRecords: 100
      security:
      - bearerAuth: []
    servers:
    - url: https://{tenant_url}
      description: Bright Pattern is multi-tenant; the base host is the customer contact-center tenant domain.
      variables:
        tenant_url:
          default: example.brightpattern.com
          description: Your Bright Pattern Contact Center tenant hostname.
