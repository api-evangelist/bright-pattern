openapi: 3.2.0
info:
  title: Bright Pattern Lists API
  version: 1.0.0
  contact:
    name: Bright Pattern
    url: https://www.brightpattern.com/contact/
  x-refined-note:
  - x-evidence differs across the merged source definitions and was not carried
  - x-origin differs across the merged source definitions and was not carried
  description: 'Operations tagged Lists across 2 of this provider''s published API definitions: bright-pattern-list-management-v3-2-openapi.yml, bright-pattern-list-management-v3-openapi.yml. Each path carries the servers of the definition it was published in.'
servers:
- url: https://{tenant_url}
  description: Bright Pattern is multi-tenant; the base host is the customer contact-center tenant domain.
  variables:
    tenant_url:
      default: example.brightpattern.com
      description: Your Bright Pattern Contact Center tenant hostname.
security:
- bearerAuth: []
tags:
- name: Lists
  description: Bright Pattern's List Management API streamlines the creation and deletion of lists and formats and provides a convenient way to manage list records.
paths:
  /configapi/v3/callinglist/getAll/{list_id}/{campaign_id}:
    post:
      operationId: getAllRecordsDeprecated
      summary: Get All Records DEPRECATED
      description: 'This method returns a list of records from a calling list associated with a campaign.


        Records are referenced by indexes, assigned to each record in the list in sequential order of insertion (beginning from 0). All records with an index greater than or equal to the requested record index, fromIndex, are returned in the response.


        Note: The returned recordset contains JSON objects sorted by the index field. List Record JSON Object has two sub-objects, entry and status, defined as follows:


        entry object: contains a copy of the list entry


        field names are retained as defined at list creation


        custom fields are returned with the prefix ''custom_'' added to the name defined in the Administrator Application


        Note: The value returned in the id field can be used to reference this record in further API requests.


        statusobject: contains the campaign results for this specific record


        omitted if the list is not assigned to the campaign or the campaign doesn''t exist


        field names are predefined


        completed field is always present, while the other fields may be absent if the record was never called or never reached an agent.


        Input parameters


        Name

        Type

        Required?

        Possible/Default Values


        maxSize

        integer, ≤ 1000

        yes (Specifies the maximum number of records per page when using cursor-based pagination)

        1...1000


        fromIndex

        string

        yes (specifies initial record index, used for pagination)

        -


        Response Codes


        Code

        Description


        200

        Success


        400

        Bad request (format not understood; 1 or more required fields are missing or have an unsupported value)


        401

        Authentication failed (invalid token format; token is expired)


        403

        Authentication succeeded but the user does not have sufficient privileges


        404

        Specified Campaign was not found;

        Specified List was not found;

        Invalid URL'
      tags:
      - Lists
      parameters:
      - name: list_id
        in: path
        required: true
        schema:
          type: string
      - name: campaign_id
        in: path
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
            example:
              fromIndex: 0
              maxSize: '100'
      responses:
        '200':
          description: 200 OK
          content:
            application/json:
              example:
              - entry:
                  firstname: Graham
                  phone: '16509999999'
                  id: '1'
                  lastname: Smith
                  status: Gold
                index: 0
                status:
                  globalInteractionID: 0B767156-D012-4F63-A3E2-12ACFC2F26EA
                  lastCallDuration: 0
                  lastDisposition: No disposition
                  totalAttempts: 1
                  completed: false
                  lastAgent: elizabeth
                  lastPhone: '16509999999'
                  lastDate: '2021-02-19T19:11:40.000'
              - entry:
                  firstname: Mike
                  phone: '16507777777'
                  id: '2'
                  lastname: Miller
                  status: Platinum
                index: 1
                status:
                  globalInteractionID: 3F4F2ACD-1233-42E3-8092-3A9F7D9D84BC
                  lastCallDuration: 0
                  lastDisposition: Try again later
                  totalAttempts: 1
                  completed: false
                  lastAgent: elizabeth
                  lastPhone: '16507777777'
                  lastDate: '2021-02-19T19:12:21.000'
              - entry:
                  firstname: Katrina
                  phone: '16505555555'
                  id: '3'
                  lastname: Johnson
                  status: Silver
                index: 2
                status:
                  globalInteractionID: 9D914127-C1C4-4587-8B30-4E2A9790D184
                  lastCallDuration: 0
                  lastDisposition: Product sold
                  totalAttempts: 1
                  completed: true
                  completedTime: '2021-02-19T19:12:37.000'
                  lastAgent: elizabeth
                  lastPhone: '16505555555'
                  lastDate: '2021-02-19T19:12:37.000'
              - entry:
                  firstname: Jenny
                  phone: '16502222222'
                  id: '4'
                  lastname: Green
                  status: Gold
                index: 3
                status:
                  globalInteractionID: 35DE77AC-5A37-4907-97CA-50B09B30ECDF
                  lastCallDuration: 0
                  lastDisposition: Fast busy
                  totalAttempts: 1
                  completed: false
                  lastAgent: elizabeth
                  lastPhone: '16502222222'
                  lastDate: '2021-02-19T19:13:08.000'
      security:
      - bearerAuth: []
    servers:
    - url: https://{tenant_url}
      description: Bright Pattern is multi-tenant; the base host is the customer contact-center tenant domain.
      variables:
        tenant_url:
          default: example.brightpattern.com
          description: Your Bright Pattern Contact Center tenant hostname.
