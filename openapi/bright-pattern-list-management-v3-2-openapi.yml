      responses:
        '200':
          description: 200 OK
      security:
      - bearerAuth: []
  /configapi/v3/callinglist/updateAll/{list_id}:
    post:
      operationId: updateManyRecords
      summary: Update Many Records
      description: "This method updates fields in existing records of a calling list and returns the number\
        \ of successfully updated records. Additionally, this method can reset optional parameters to\
        \ their default values by passing \" \" or null to these parameters.\n\nNote: Manipulating the\
        \ content of calling lists requires the user to have an additional \"Update content of calling\
        \ list\" privilege.\n\nThis method catches and displays the following errors (if any were encountered\
        \ during the request execution):\n\nmissingKey - one or more key field values were not found;\n\
        \nkeyNotFound - a record with the same key already exists in the DNC list;\n\nformatError - format\
        \ was mismatched in one or more field values (e.g. string value was defined for an integer field);\
        \ one or more unsupported fields were defined in the request body\n\nNote: This method is similar\
        \ to the Update Record method. However, the input parameters differ to accommodate updating multiple\
        \ records within one request. This is done to account for the fact that each request requires\
        \ reprocessing of the entire calling list.\n\nInput parameters\n\nName\nType\nRequired?\nPossible/Default\
        \ Values\n\nDNC List Record JSON Objects\nlist\nyes (only the key fields are required)\n-\n\n\
        Response Codes\n\nCode\nDescription\n\n200\nSuccess\n\n400\nBad request (format not understood;\
        \ 1 or more required fields are missing or have an unsupported value)\n\n401\nAuthentication failed\
        \ (invalid token format; token is expired)\n\n403\nAuthentication succeeded but the user does\
        \ not have sufficient privileges\n\n404\nSpecified List was not found;  \nInvalid URL"
      tags:
      - Lists
      parameters:
      - name: list_id
        in: path
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
            example:
            - date_time: 01-11-2023
              phone: '1004'
            - date_time: 12-11-2023
              phone: '10045'
      responses:
        '200':
          description: 200 OK
          content:
            application/json:
              example:
                updated: 1
                error:
                  keyNotFound:
                  - phone: '1004'
      security:
      - bearerAuth: []
  /configapi/v3/callinglist/update/{list_id}:
    post:
      operationId: updateRecord
      summary: Update Record
      description: "This method updates fields in an existing record of a calling list. Additionally,\
        \ this method can reset an optional parameter to its default value by passing \" \" or null to\
        \ that parameter.\n\nNote: Manipulating the content of calling lists requires the user to have\
        \ an additional \"Update content of calling list\" privilege.\n\nThe search for the record is\
        \ performed based on the defined key fields. The request can contain either a full or partial\
        \ set of fields of the List Record JSON Object, but the key fields are mandatory and must be retained\
        \ as configured during list creation.\n\nBefore the record is queried, its existence in the specified\
        \ list is checked by its unique key values. If the record does exist in the specified list, the\
        \ record is updated successfully.\n\nNote: If a PHONE type field is defined as a key, the record\
        \ value is checked for a full match with the value stored in the database or the original source\
        \ (if the data was modified upon loading into the database).\n\nTo avoid disruptions in the campaign\
        \ work caused by the list reprocessing time, the Dialer ignores the changes made to the record\
        \ until it makes a call attempt to that record. Thus, if a list containing the updated record\
        \ has Filters or Sorting configured, the changes made to that record will not affect that filtering\
        \ or sorting order.\n\nNote: Always remember to reapply the desired Filters or Sorting settings\
        \ if you wish for it to reflect the changes made to the updated record.\n\nInput parameters\n\n\
        Name\nType\nRequired?\nPossible/Default Values\n\nDNC List Record JSON Object\nstring\nyes (can\
        \ provide either all or some fields; key fields are mandatory and must have a value)\n-\n\nResponse\
        \ Codes\n\nCode\nDescription\n\n200\nSuccess\n\n400\nBad request (format not understood; 1 or\
        \ more required fields are missing or have an unsupported value)\n\n401\nAuthentication failed\
        \ (invalid token format; token is expired)\n\n403\nAuthentication succeeded but the user does\
        \ not have sufficient privileges\n\n404\nSpecified List was not found;  \nSpecified Record was\
        \ not found;  \nInvalid URL"
      tags:
      - Lists
      parameters:
      - name: list_id
        in: path
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
            example:
              date_time: 01-11-2023
              phone: '1004'
      responses:
        '200':
          description: 200 OK
      security:
      - bearerAuth: []
  /configapi/v3/callinglist/delete/{list_id}:
    post:
      operationId: deleteManyRecords
      summary: Delete Many Records
      description: "This method deletes records from a list and returns the number of successfully deleted\
        \ records.\n\nNote: Manipulating the content of calling lists requires the user to have an additional\
        \ \"Update content of calling list\" privilege.\n\nRecords are searched for by one or many criteria\
        \ defined in correspondence with the associated list fields. At least one of the available filtering\
        \ criteria has to be specified. Otherwise, no record is deleted.\n\nThe method supports filtering\
        \ records by:\n\nkey and searchable fields (defined in the fields.some_field parameter);\n\nstatus\
        \ in the associated campaign (defined in the byCampaignResult.policy parameter);\n\ncreation date\
        \ (defined in the createdFrom and createdTo parameters);\n\ncombination of the above\nNote: If\
        \ several criteria are specified, the record should match all of them\n\nNote: Filtered records\
        \ will be deleted from all campaigns the list is associated with.\n\nInput parameters\n\nName\n\
        Type\nRequired?\nPossible/Default Values\n\nfields.some_field\nstring\nno (specifies the fields\
        \ to be used for search; the field must be searchable or key)\n-\n\nbyCampaignResult.campaignId\n\
        string\nno (specifies that the records are to be filtered by their associated campaign; campaignId\
        \ is required (can be found in the Get List response)\n-\n\nbyCampaignResult.policy\nstring\n\
        no (specifies that the records are to be filtered by their state; if = ONLY_COMPLETED, both completed\
        \ and expired records are removed)\nALL (Default);  \nONLY_COMPLETED;  \nONLY_NEVER_ATTEMPTED;\n\
        \ncreatedFrom\ntime (UTC)\nno (allows filtering by creation date; must be less than createdTo,\
        \ if configured)\n-\n\ncreatedTo\ntime (UTC)\nno (allows filtering by creation date; must be more\
        \ than createdFrom, if configured)\n-\n\nResponse Codes\n\nCode\nDescription\n\n200\nSuccess\n\
        \n400\nBad request (format not understood; 1 or more required fields are missing or have an unsupported\
        \ value)\n\n401\nAuthentication failed (invalid token format; token is expired)\n\n403\nAuthentication\
        \ succeeded but the user does not have sufficient privileges\n\n404\nSpecified List was not found;\
        \  \nInvalid URL\n\n422\n????????????????????????????????????????1 or more required fields are\
        \ missing"
      tags:
      - Lists
      parameters:
      - name: list_id
        in: path
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
            example:
              fields:
                accountId:
                - id1
                - id2
                - id3
              byCampaignResult:
                campaignId: 85389D39-E05C-4CE7-B36D-4401BEA52E14
                policy: ALL
              createdFrom: '2023-01-01T00:00:00.000'
              createdTo: '2023-01-10T00:00:00.000'
      responses:
        '200':
          description: 200 OK
          content:
            application/json:
              example:
                deleted: 3
      security:
      - bearerAuth: []
  /configapi/v3/callinglist/erase/{list_id}:
    post:
      operationId: eraseRecord
      summary: Erase Record
      description: "This method removes a record from a list and all associated campaign results. The\
        \ search for the record is performed based on the defined key fields. An error is returned if\
        \ a record does not exist.\n\nNote: Manipulating the content of calling lists requires the user\
        \ to have an additional \"Update content of calling list\" privilege.\n\nBright Pattern Contact\
        \ Center solution supports several voice campaign modes (see here). If the last record is being\
        \ deleted, depending on the mode of the associated campaign, the active call behavior will differentiate\
        \ as follows:\n\nProgressive, Predictive, or Automatic (IVR) campaigns\nUpon instance deletion,\
        \ all active, i.e. in a dialing state, within a script, or connected to an agent, calls are dropped\n\
        \nPreview campaigns\nUpon instance deletion, only the calls not yet picked up by an agent are\
        \ dropped. In-progress and connected calls are not affected\n\nOtherwise, if there are still other\
        \ records in the list, the method won't impact any calls.\n\nThe list of deleted records with\
        \ completed calls, as well as their results, are archived and available for downloading in the\
        \ Contact Center Administrator application (see here). Interaction results for dropped calls are\
        \ not saved.\n\nNote: This method does not delete contacts, activities, voice recordings, transcriptions,\
        \ or screen recordings. This functionality is covered by other APIs.\n\nInput parameters\n\nName\n\
        Type\nRequired?\nPossible/Default Values\n\nfields\nstring\nyes (specifies the key fields to be\
        \ used for the object search; the non-key fields are ignored)\n-\n\nreason\nstring\nyes (used\
        \ to specify the reason for audit log purposes)\n-\n\nResponse Codes\n\nCode\nDescription\n\n\
        200\nSuccess\n\n400\nBad request (format not understood; 1 or more required fields are missing\
        \ or have an unsupported value)\n\n401\nAuthentication failed (invalid token format; token is\
        \ expired)\n\n403\nAuthentication succeeded but the user does not have sufficient privileges\n\
        \n404\nSpecified List was not found;  \nSpecified Record was not found;  \nInvalid URL"
      tags:
      - Lists
      parameters:
      - name: list_id
        in: path
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
            example:
              fields:
                phone: '1004'
              reason: for audit log
      responses:
        '200':
          description: 200 OK
      security:
      - bearerAuth: []
  /configapi/v3/callinglist/deleteAll/{list_id}:
    post:
      operationId: deleteAllRecords
      summary: Delete All Records
      description: "This method removes all records from a list and returns the number of successfully\
        \ deleted records.\n\nNote: Manipulating the content of calling lists requires the user to have\
        \ an additional \"Update content of calling list\" privilege.\n\nBright Pattern Contact Center\
        \ solution supports several voice campaign modes (see here). Depending on the mode of the associated\
        \ campaign, the active call behavior will differentiate as follows:\n\nProgressive, Predictive,\
        \ or Automatic (IVR) campaigns\nUpon instance deletion, all active, i.e. in a dialing state, within\
        \ a script, or connected to an agent, calls are dropped\n\nPreview campaigns\nUpon instance deletion,\
        \ only the calls not yet picked up by an agent are dropped. In-progress and connected calls are\
        \ not affected\n\nThe list of deleted records with completed calls, as well as their results,\
        \ are archived and available for downloading in the Contact Center Administrator application (see\
        \ here). Interaction results for dropped calls are not saved.\n\nResponse Codes\n\nCode\nDescription\n\
        \n200\nSuccess\n\n400\nBad request (format not understood; 1 or more required fields are missing\
        \ or have an unsupported value)\n\n401\nAuthentication failed (invalid token format; token is\
        \ expired)\n\n403\nAuthentication succeeded but the user does not have sufficient privileges\n\
        \n404\nSpecified List was not found;  \nInvalid URL"
      tags:
      - Lists
      parameters:
      - name: list_id
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: 200 OK
          content:
            application/json:
              example:
                deleted: 2
      security:
      - bearerAuth: []
