        \ format; token is expired)\n\n403\nAuthentication succeeded but the user does not have sufficient\
        \ privileges\n\n404\nSpecified campaign was not found;  \nSpecifed DNC list was not found;  \n\
        Invalid URL"
      tags:
      - DNC Lists
