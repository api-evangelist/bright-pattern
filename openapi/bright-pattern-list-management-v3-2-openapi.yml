  /configapi/v3/callinglist/deleteList/{list_id}:
    delete:
      operationId: deleteListAndOrphanedFormat
      summary: Delete List and Orphaned Format
      description: "This method deletes a list, archiving all records with associated campaign results\
        \ associated with that list. If the last list using a specific format was deleted, that format\
        \ is removed as well.\n\nNote: Bright Pattern Contact Center solution supports several voice campaign\
        \ modes (see here). Depending on the mode of the associated campaign, the active call behavior\
        \ will differentiate as follows:\n\nProgressive, Predictive, or Automatic (IVR) campaigns\nUpon\
        \ instance deletion, all active, i.e. in a dialing state, within a script, or connected to an\
        \ agent, calls are dropped\n\nPreview campaigns\nUpon instance deletion, only the calls not yet\
        \ picked up by an agent are dropped. In-progress and connected calls are not affected\n\nThe results\
        \ of completed calls are archived and available for downloading in the Contact Center Administrator\
        \ application (see here). Interaction results for dropped calls are not saved.\n\nResponse Codes\n\
        \nCode\nDescription\n\n200\nSuccess\n\n400\nBad request (format not understood; 1 or more required\
        \ fields are missing or have an unsupported value)\n\n401\nAuthentication failed (invalid token\
        \ format; token is expired)\n\n403\nAuthentication succeeded but the user does not have sufficient\
        \ privileges\n\n404\nSpecified List was not found;  \nInvalid URL"
      tags:
      - Lists
      parameters:
      - name: list_id
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: 200 OK
      security:
      - bearerAuth: []
  /configapi/v3/callinglist/createList:
    post:
      operationId: createList
      summary: Create List
      description: "This method creates a new empty list using an existing format. The format is specified\
        \ by its unique identifier, formatId, returned in the response body of the Get Lists method (see\
        \ here).\n\nInput parameters\n\nName\nType\nRequired?\nPossible/Default Values\n\nformatId\nstring\n\
        yes (can be found in the Get Lists  response)\n-\n\nResponse Codes\n\nCode\nDescription\n\n200\n\
        Success\n\n400\nBad request (format not understood; 1 or more required fields are missing or have\
        \ an unsupported value)\n\n401\nAuthentication failed (invalid token format; token is expired)\n\
        \n403\nAuthentication succeeded but the user does not have sufficient privileges\n\n404\nSpecified\
        \ Format was not found;  \nInvalid URL\n\n409\nDuplicate name error"
      tags:
      - Lists
      requestBody:
        required: true
        content:
          application/json:
            schema:
