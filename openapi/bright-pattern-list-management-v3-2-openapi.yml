                  defaultTimezone: Europe/Dublin
                  totalRecords: 100
                - id: 635DB66C-AA54-41C9-9F0E-AC3A9B5EDB2D
                  name: List 2.csv
                  formatId: 31002C90-7188-11EE-A565-0800200C9A66
                  formatName: format 1
                  allowUsingDefaultTimezone: false
                  totalRecords: 100
      security:
      - bearerAuth: []
