          description: 200 OK
      security:
      - bearerAuth: []
  /configapi/v3/campaign/bindDNCList/{campaign_id}:
    post:
      operationId: bindDncList
      summary: Bind DNC List
      description: "This method adds a DNC list to the campaign, referenced by its ID in the path variable.\n\
        \nNote: Manipulating calling lists associated with a campaign requires the user to have an additional\
        \ \"Start campaigns and enable lists\" privilege.\n\nInput parameters\n\nName\nType\nRequired?\n\
