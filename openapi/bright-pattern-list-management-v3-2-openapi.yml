        \ for the campaign.\n\nNote: This method is not supported for Outbound Messaging campaigns.\n\n\
        Depending on the mode of the associated campaign, the active call behavior will differentiate\
        \ as follows:\n\nProgressive, Predictive, or Automatic (IVR) campaigns: Upon instance deletion,\
        \ all active, i.e. in a dialing state, within a script, or connected to an agent, calls are dropped.\n\
        \nPreview campaigns: Upon instance deletion, only the calls not yet picked up by an agent are\
        \ dropped. In-progress and connected calls are not affected.\n\nResponse Codes\n\nCode\nDescription\n\
        \n200\nSuccess\n\n400\nBad request (format not understood; 1 or more required fields are missing\
        \ or have an unsupported value)\n\n401\nAuthentication failed (invalid token format; token is\
        \ expired)\n\n403\nAuthentication succeeded but the user does not have sufficient privileges\n\
        \n404\nSpecified campaign was not found;  \nInvalid URL\n\n422\nNot supported for Outbound Messaging\
        \ campaigns"
      tags:
      - Campaigns
      parameters:
      - name: campaign_id
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: 200 OK
      security:
      - bearerAuth: []
