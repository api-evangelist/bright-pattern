  /configapi/v3/donotcalllist/createDNCList:
    post:
      operationId: createDncList
      summary: Create DNC List
      description: "This method creates a new empty DNC list. Depending on the specified DNC list type,\
        \ the creation process is as follows:\n\nFor Internal, Geographic, Area Codes - new DNC lists\
        \ are created using the fixed format corresponding to the list type\n\nFor Record Exclusion -\
        \ the exclusion field has to be explicitly specified in the request body\n\nAdditionally, for\
        \ DNC lists of Area Codes and Geographic Postal types, the ISO country code has to be explicitly\
        \ specified in the request body.\n\nNote: For Area Codes, additional option “Each area code had\
        \ country prefix” is available. This option can be specified using “Prefixed” as the country value.\n\
        \nOn succesfull excution, the response should contain the ID of the newly created DNC list.\n\n\
        Input parameters\n\nName\nType\nRequired?\nPossible/Default Values\n\nname\nstring, ≤ 255 characters\
        \  \n  \nNote: DNC list name must be unique within the contact center\nyes\n-\n\ntype\nstring\n\
        yes\n“INTERNAL”  \n“GEOGRAPHIC_POSTAL”  \n“AREA_CODES”  \n“EXCLUSION”\n\ncountry\nISO country\
        \ code;  \nOR “prefixed” (applicable only to DNC lists of Area Codes type)\nonly required for\
        \ DNC lists of Area Codes and Geographic Postal types\n\nexpireRecords\nboolean\nonly required\
        \ for DNC lists of Internal and Record Exclusion types\nDefault = false\n\ndefaultExpirationPeriod\n\
        integer, [0, 365]  \nNote: Specifies number of days since record was added to the DNC list, after\
        \ which that records is considered expired by the Dialer\nrequired, if expireRecords = true\n\
        Default = 90 days\n\nexclusionField\nFiled name to be set as \"key\" for records exclusion  \n\
        \  \nNote: Must contain a valid field from the available calling list formats.\nonly required\
        \ for DNC lists of Record Exclusion type\n-\n\nresetDaily\nboolean\nonly required for DNC lists\
        \ of Record Exclusion type\nDefault = false\n\nresetPeriod\nJSON object, consisting of:  \n  \n\
        resetTime, formatted as HH:mm:ss  \nAND  \n  \ntimezoneID, formatted as {Area}/{Location}  \n\
        e.g., \"America/New_York\"\nrequired, if resetDaily = true\nDefault resetTime = 00:00:00  \n \
        \ \nDefault timezoneID = user’s timezone\n\nResponse Codes\n\nCode\nDescription\n\n200\nSuccess\n\
        \n400\nBad request (format not understood; 1 or more required fields are missing or have an unsupported\
        \ value)\n\n401\nAuthentication failed (invalid token format; token is expired)\n\n403\nAuthentication\
        \ succeeded but the user does not have sufficient privileges\n\n404\nInvalid URL\n\n409\nDuplicate\
        \ name error"
      tags:
      - DNC Lists
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: string
            example: "//FOR INTERNAL, GEOGRAPHIC POSTAL, AREA CODES\n\n{\n    \"name\": \"DNC - June\"\
              ,\n    \"type\": \"INTERNAL\",\n    \"expireRecords\": true, \n    \"defaultExpirationPeriod\"\
              : 120\n}\n\n//FOR GEOGRAPHIC POSTAL, AREA CODES\n\n{\n    \"name\": \"DNC - June\",\n  \
              \  \"type\": \"AREA_CODES\",\n    \"country\": \"US\"\n}\n\n//FOR RECORD EXCLUSION\n\n{\n\
              \    \"name\": \"Account Exclusion List\",\n    \"type\": \"EXCLUSION\",\n    \"expireRecords\"\
              : true, \n    \"defaultExpirationPeriod\": 120, \n    \"exclusionField\": \"Account Number\"\
              ,\n    \"resetDaily\" : true,\n    \"resetPeriod\": \n        { \n        \"time\": \"04:00:00\"\
              ,\n        \"timezoneID\" : \"America/Los_Angeles\" \t\n        }\n}"
      responses:
        '200':
          description: 200 OK
          content:
            application/json:
              example:
                id: 31CAA7DA-0AE2-4D1A-BE8C-07CA1A4C39AE
      security:
      - bearerAuth: []
