openapi: 3.1.0
info:
  title: BPCC List Management API v3.2
  version: 1.0.0
  description: 'Overview


    Bright Pattern''s List Management API supports a wide range of functionalities previously only accessible
    within the Contact Center Administrator application. Version 3.2 delivers expanded list and campaign
    management functionality, introducing comprehensive API support for Do Not Call (DNC) lists and improved
    methods for accessing Calling List records.


    Bright Pattern''s List Management API 3.2 enables you to:


    Manage outbound campaigns, including their DNC list (new*) and calling list associations


    Update outbound campaign states, access their information, and view their results


    Create new lists and new formats


    View and update (new*) calling list properties


    Manage calling list and DNC list records individually or in bulk


    Retrieve the contents of Calling Lists not associated with campaigns (new*)


    Create, retrieve, update, and delete DNC lists (new*)


    Note: To ensure compatibility with the last API version and facilitate seamless migration, all previously
    available methods are retained as is. However, methods with a "DEPRECIATED" tag in their name are
    not recommended for usage and have new corresponding methods defined for their respective functionalities.


    This document describes the available REST API methods, specifies their functionality, and provides
    example requests and responses. Individual methods, as well as the entire List Management API 3.1
    collection, can be loaded into Postman and interacted with via your unique Bright Pattern Contact
    Center access token.


    new* - added since List API 3.0'
  contact:
    name: Bright Pattern
    url: https://www.brightpattern.com/contact/
  x-origin:
  - format: postman
    url: https://documenter.getpostman.com/view/8336025/2sB3WmV3UC
    version: '2.1'
  x-evidence:
    fetched: '2026-08-08'
    source: https://documenter.gw.postman.com/api/collections/8336025/2sB3WmV3UC?segregateAuth=true&versionTag=latest
    http_status: 200
    method: derived-from-published-postman-collection
    note: Mechanically converted from the Postman collection Bright Pattern publishes as its public API
      reference. No operations, paths, parameters or examples were invented.
servers:
- url: https://{tenant_url}
  description: Bright Pattern is multi-tenant; the base host is the customer contact-center tenant domain.
  variables:
    tenant_url:
      default: example.brightpattern.com
      description: Your Bright Pattern Contact Center tenant hostname.
tags:
- name: Authentication
  description: 'The authentification method described in this section is the first step required to successfully
    use Bright Pattern''s List Management API. The clients of this API are authenticated in correspondence
    with the OAuth 2.0 Client Credentials Grant. Requests made via this API are authenticated via an access
    token.


    Note: Only the users with corresponding privileges can perform selected operations via this API. The
    complete list of privileges can be found here.


    To obtain the access token:


    Login to the Contact Center Administrator application.


    Navigate to the Users page. Select or create a user with privileges corresponding to the tasks you
    wish to perform via the List Management API.


    Click the Generate button to generate an API secret. Copy the generated key and note the username
    for the next steps.


    Use the Get Access Token method to obtain an access token. Set the client_id to the username and client_secret
    to the generated API secret key.


    Use the value of access_token, returned in the response, to set the Authorization: Bearer [access
    token] headers of each subsequent request made via the List Management API.'
- name: Campaigns
  description: 'Bright Pattern''s List Management API provides a convenient way to perform routine campaign
    management tasks without the Contact Center Administrator application. The API methods described in
    this section let managers duplicate, update, or delete campaigns; manage link groups; control campaign
    state; modify specific outbound dialing settings; configure caller ids, dispositions, and dial rules;
    and assign or remove lists.


    Bright Pattern Contact Center solution defines several outbound campaign types - Outbound Voice, Blended
    Voice, and Outbound Messaging. Unless otherwise stated, the API methods described in this section
    and the following sections support all campaign types. If a method does not support Outbound Messaging
    (and applies only to Outbound Voice and Blended Voice), this is explicitly noted in that method’s
    description.


    Note: Performing operations on all campaigns requires the user to have the "Manage all services and
    campaigns" privilege, configured in the Contact Center Administrator application. Alternatively, the
    "Manage assigned services and campaigns" privilege must be enabled for users to manipulate only their
    assigned campaigns. Additional privileges required are explicitly specified in the corresponding method
    descriptions.


    The methods described below use the path variable, campaign_id, to reference the campaign, an operation
    is to be performed on. The unique identifier of a campaign can be found by opening that campaign in
    the Contact Center Administrator application, Services & Campaigns section. The id will be displayed
    in the ''#SERVICES_CAMPAIGNS:SERVICES_PROPERTIES:'' fragment of the URL.


    Alternatively, campaign_id, can be found in the response body of the Get Campaigns method (see here).'
- name: Lists
  description: 'Bright Pattern''s List Management API streamlines the creation and deletion of lists and
    formats and provides a convenient way to manage list records.


    Note: Performing operations on lists requires the user to have the "Manage Lists" privilege, configured
    in the Contact Center Administrator application. Additional privileges required are explicitly specified
    in the corresponding method description.


    All of the methods described below use the path variable, list_id, to specify the list an operation
    is to be performed on. The unique identifier of a list can be found by opening that list in the Contact
    Center Administrator application, Lists section. The id will be displayed in the ''#LISTS:LISTS_PROPERTIES:''
    fragment of the URL.


    Alternatively, list_id, can be found in the response body of the Get Lists method (see here).


    Methods retained from the previous version of the List management API, tagged as "DEPRECIATED", require
    an additional path variable, campaign_id, to reference the campaign associated with the selected list.
    The unique identifier of a campaign can be found by opening that campaign in the Contact Center Administrator
    application, Services & Campaigns section. The id will be displayed in the ''#SERVICES_CAMPAIGNS:SERVICES_PROPERTIES:''
    fragment of the URL.


    Alternatively, campaign_id, can be found in the response body of the Get Campaigns method (see here).


    Note: When importing records or updating records it is important to remember that:


    All leading and trailing whitespaces should be deleted.


    For all PHONE numbers:


    If a number begins with “+”, the leading "+" sign will be removed.


    If a number contains non-numeric characters, they will be removed.


    At least one PHONE number is required.


    For the United States and Canada PHONE numbers:


    If a number begins with “011”, it will be kept as is.


    If a number begins with “1” and has eleven digits, it will be kept as is.


    If a number does not begin with “1” and has ten digits, “1” will be prepended.


    If a number begins with “1” and has ten digits, the record will not be imported, returning a format
    error.


    In any other case, the record will not be imported, returning a format error.


    Remove prefix and Default country code fields will be ignored.


    For Other countries PHONE numbers:


    If a number begins with prefix matching Remove prefix, the prefix will be deleted.


    If a number does not begin with prefix matching Remove prefix, it will be kept as is.


    If a number does not begin with prefix matching Default country code, Default country code will be
    added.


    For all INTEGER fields:


    If the value is presented as a string, it should be converted to an integer.


    Values presented as integers should be supported.


    For all fields that expect strings (ACCOUNT, AGENT_LOGIN_ID, FIRST_NAME, LAST_NAME, etc.) integer
    values should be converted to strings.


    Capitalization matters: values with different capitalizations are treated as distinct.


    For all DATE/TIME and DATE/TIME - SCHEDULE CALL AT fields:


    If a…'
- name: DNC Lists
  description: "Bright Pattern's List Management API makes it easy to manage the contents of Do Not Call\
    \ (DNC) lists with bulk delete, add, and replace actions. The API methods described in this section\
    \ fully support Internal, Geographic (Postal), Geographic (Area codes), and Record Exclusion DNC list\
    \ types. Geographic (State/Province) DNC List type is not supported in the current implementation.\n\
    \nNote: Performing operations on DNC lists requires the user to have the \"Manage Lists\" privilege,\
    \ configured in the Contact Center Administrator application.\n\nThe functionality of the API methods\
    \ described in this section is built upon a DNC List Record JSON Object with a required non-empty\
    \ key field and an optional comment field. Depending on the DNC list type, the object's field values\
    \ vary as follows:\n\nDNC List Type\nField Values\n\nInternal\nkey (required field): Phone number\
    \  \ncomment (optional field): Campaign Name\n\nGeographic (Postal)\nkey (required field): Postal\
    \ Code  \ncomment (optional field): Notes\n\nGeographic (Area Codes)\nkey (required field): Area code\
    \  \ncomment (optional field): Notes\n\nRecord Exclusion\nkey (required field): Exclusion field  \n\
    comment (optional field): -\n\nNote: When importing records or updating records it is important to\
    \ remember that:\n\nAll leading and trailing whitespaces should be deleted.\n\nAll integer values\
    \ should be converted to strings.\n\nCapitalization matters: values with different capitalizations\
    \ are treated as distinct.\n\nThe search can be performed by both the original values created in third-party\
    \ systems and their transformed equivalents visible in the Administrator Application and Agent Desktop."
- name: Cursor-based Pagination
  description: 'Cursor-based Pagination, utilized in many of the Bright Pattern''s List Management API
    methods is a current state-of-the-art approach to dealing with large volumes of data.


    In cases where API requests are expected to contain many and many rows of records, returning them
    all at once is not an option. Instead, it makes sense to return one subset of a predefined size, a
    page, at a time. This technique, called paging, is commonly used across the majority of APIs. The
    cursor-based part of our approach comes from the idea of using a "cursor" - something like a bookmark
    that points exactly to where you left off.


    At the core of Cursor-based pagination lies a rather basic concept of pointers. The pointer in this
    case is called a "cursor", and is used to reference a specific record in a database. In each request,
    clients pass cursor along with page_size parameter that specifies the number of records returned per
    page.


    It is important to remember that:


    The cursor must refer to a specific unique value in the database.

    If the cursor value is not provided, the first record in the database will be used by default.


    The number of records, specified in page_size , with corresponding field values less than the value
    of cursor are returned.

    If the number of records returned is less than page_size, it implies that there are no more records
    and the page returned was the last one.


    The record whose position is page_size + 1 is passed back to the client as the next_cursor.'
- name: Link Groups
  description: Bright Pattern's List Management API provides the ability to manage Link Groups so several
    campaigns can be linked together. When processing all records of one campaign is finished, the next
    campaign in the group will be started automatically. Additionally, see the Link a Campaign and Unlink
    a Campaign methods descriptions.
- name: Error Handling
  description: "Note: This section provides general information regarding unsuccessful execution responses.\
    \ We recommend you refer to the Response Codes description provided for each method individually for\
    \ more specific information about any encountered errors.\n\nBright Pattern’s List Management API\
    \ utilizes standard HTTP codes to indicate successful execution and flag errors if any occur. For\
    \ each error listed in this documentation, the response includes the following information:\n\nHuman-readable\
    \ error name - e.g. \"bad_request\"\n\nDetailed description of what caused the error to occur - e.g.\
    \ \"'parameter_name' has unsupported value 'parameter_value': integer is expected\"\n\nand has the\
    \ following format:\n\n{ \n  “error”: “name”, //error name\n  “error_description”: “description” //detailed\
    \ description of the reasons that led to this error\n}\n\nNote: We highly recommend paying close attention\
    \ to the content of error_description as it offers useful information to aid debugging.\n\nPossible\
    \ Errors\n\nThe table below contains the full list of HTTP errors and specifies possible underlying\
    \ reasons for each of them.\n\nError\nDescription\nPossible Reasons\n\n400 Bad Request\nRequest cannot\
    \ be processed due to a format error\n- Empty or missed required parameter  \n- Duplicated parameter\
    \  \n- Unsupported parameter  \n- Wrong value format or value out of boundaries\n\n401 Unauthorized\n\
    Authentification failed for some reason\n- Wrong Client ID/Secret or Grant type  \n- Tenant is inactive\
    \  \n- Client is disabled or locked out  \n- Token is expired or has an invalid format\n\n403 Forbidden\n\
    Requested operation cannot be performed due to insufficient privileges on the current user's profile\n\
    - User is authenticated but doesn't have sufficient privileges\n\n404 Not Found\nSpecified resource\
    \ cannot be found\n- Wrong path or key  \n- Wrong or missing object ID\n\n405 Method Not Allowed\n\
    Requested method cannot be performed for the specified resource\n- Wrong request type  \n- HEAD request\
    \ type\n\n409 Conflict\nRequest conflicts with the current state of the server\n- Duplicate or missing\
    \ value  \n- Issue with specified instance  \n- Campaign is already in the requested state  \n- List\
    \ is not bound to the specified campaign\n\n415 Unsupported Media Type\nMedia format of the requested\
    \ data is not supported\n- No content type in HTTP header  \n- Content type is text/plain but JSON\
    \ is expected"
paths:
  /configapi/v3/oauth/token:
    post:
      operationId: getAccessToken
      summary: Get Access Token
      description: 'This method returns an access token that will be used to authenticate each subsequent
        request made via this API.


        Note: Access Tokens expire after 1 hour and require renewal.


        Supplementing invalid credentials in any of the parameters will return a 401 Authentification
        failed response. Client authentification will also fail if the selected user is locked out or
        disabled, or the chosen tenant is inactive.


        Note: Clients are authenticated using OAuth 2.0 Client Credentials Grant, therefore, thegrant_type
        parameter is always set to ''client_credentials''. Examples of other parameter values can be found
        in the Request body below.'
      tags:
      - Authentication
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                client_id:
                  type: string
                client_secret:
                  type: string
                scope:
                  type: string
                grant_type:
                  type: string
            example:
              client_id: 'Username '
              client_secret: API secret
              scope: <tenant_URL>
              grant_type: client_credentials
      responses:
        '200':
          description: 200 OK
          content:
            application/json:
              example:
                access_token: 9E266F3C6189F70D10CBDCB6C7D457FB690C0BF401841F3FB29C463D9251FB1D
                token_type: Bearer
                expires_in: '3480'
                scope: example.com
      security: []
  /configapi/v3/campaign/getCampaign/{campaign_id}:
    get:
      operationId: getCampaign
      summary: Get Campaign
      description: "This method returns all campaign settings. To request only specific parts of the settings\
        \ (e.g., only assigned teams), use the include query parameter with comma-separated values. If\
        \ include is not specified, the method behaves the same as Get Campaign 3.1 (backward compatible).\
        \ Possible values for include are:\n\n\\\\*: Returns all settings\n\ngeneralSettings\n\ncallerIdSettings\n\
        \noutboundGeneral\n\nteams\n\ncallerIDs\n\ndispositions\n\nlists\n\ndncLists\n\nNote: The include\
        \ query parameter is not supported for Outbound Messaging campaigns.\n\nResponse Codes\n\nCode\n\
        Description\n\n200\nSuccess\n\n400\nBad request (format not understood; 1 or more required fields\
        \ are missing or have an unsupported value)\n\n401\nAuthentication failed (invalid token format;\
        \ token is expired)\n\n403\nAuthentication succeeded but the user does not have sufficient privileges\n\
        \n404\nSpecified campaign was not found;  \nInvalid URL\n\n422\nInclude parameter is not supported\
        \ for Outbound Messaging campaigns"
      tags:
      - Campaigns
      parameters:
      - name: campaign_id
        in: path
        required: true
        schema:
          type: string
      - name: include
        in: query
        required: false
        schema:
          type: string
      responses:
        '200':
          description: 'Outbound Voice: no include'
          content:
            application/json:
              example:
                name: Campaign name
                enabled: true
                state: STOPPED
                direction: OUTBOUND_VOICE
                lists:
                - id: 635DB66C-AA54-41C9-9F0E-AC3A9B5EDB2D
                  name: List 1.csv
                  instanceId: DBA3A9B0-6CC4-11EE-807C-0800200C9A66
                  instanceName: ''
                  enabled: true
                  order: 1
                  dialingRatio: 1
                  sortingOrder:
                    type: CUSTOM
                    sortingFields:
                    - fieldId: f1
                      fieldName: Priority
                      sortOrder: ASC
                  totalRecords: 100
                - id: 92A7FE1C-3EC1-4A4E-A662-7A8E57E6CA78
                  name: List 2.csv
                  instanceId: 99B6B870-6CC5-11EE-807C-0800200C9A66
                  instanceName: filtered
                  enabled: false
                  order: 1
                  dialingRatio: 1
                  sortingOrder:
                    type: NATURAL
                    sortingFields: []
                  totalRecords: 50
                dncLists:
                - id: A5717BD2-C610-4AE9-B1B3-0DBE34CA31BD
                  name: List 1
                  type: GEOGRAPHIC_AREACODE
                  Country: US
                  disposition: Number matches DNC
                - id: B494BB83-C359-4432-A720-9858A6990E06
                  name: List 2
                  type: EXCLUSION
                  listField: accountId
                  disposition: Number matches DNC
      security:
      - bearerAuth: []
  /configapi/v3/campaign/getAll:
    get:
      operationId: getCampaigns
      summary: Get Campaigns
      description: 'This method returns a list of enabled outbound campaigns, their current states, and
        unique identifiers. Based on the user privileges configured, the list will contain all campaigns
        or only those assigned to this user (see here). An empty list will be returned if no outbound
        campaign is currently enabled or the user has no assigned campaigns.


        Note: A campaign''s unique identifier returned in the response body can be used to reference that
        campaign in the path variables of further API requests.


        Response Codes


        Code

        Description


        200

        Success


        400

        Bad request (format not understood; 1 or more required fields are missing or have an unsupported
        value)


        401

        Authentication failed (invalid token format; token is expired)


        403

        Authentication succeeded but the user does not have sufficient privileges


        404

        Invalid URL'
      tags:
      - Campaigns
      responses:
        '200':
          description: 200 OK
          content:
            application/json:
              example:
              - id: 85389D39-E05C-4CE7-B36D-4401BEA52E14
                name: Campaign name
                state: STOPPED
              - id: 48B91DC5-A8CD-4FCA-9AF8-EC20A4ACC14B
                name: Campaign name 2
                state: RUNNING
      security:
      - bearerAuth: []
  /configapi/v3/campaign/getStatus/{campaign_id}:
    get:
      operationId: getCampaignStatus
      summary: Get Campaign Status
      description: "This method returns the current state, i.e. STOPPED or RUNNING, of an enabled or disabled\
        \ campaign.\n\nResponse Codes\n\nCode\nDescription\n\n200\nSuccess\n\n400\nBad request (format\
        \ not understood; 1 or more required fields are missing or have an unsupported value)\n\n401\n\
        Authentication failed (invalid token format; token is expired)\n\n403\nAuthentication succeeded\
        \ but the user does not have sufficient privileges\n\n404\nSpecified campaign was not found; \
        \ \nInvalid URL"
      tags:
      - Campaigns
      parameters:
      - name: campaign_id
        in: path
        required: true
        schema:
          type: string
      responses:
        '404':
          description: 200 OK
          content:
            application/json:
              example:
                name: Campaign name
                enabled: true
                state: STOPPED
      security:
      - bearerAuth: []
  /configapi/v3/campaign/start/{campaign_id}:
    post:
      operationId: start
      summary: Start
      description: "This method starts an enabled campaign, first checking that the campaign is not disabled\
        \ or already running.\n\nNote: Manipulating campaign states requires the user to have an additional\
        \ \"Start campaigns and enable lists\" privilege.\n\nResponse Codes\n\nCode\nDescription\n\n200\n\
        Success\n\n400\nBad request (format not understood; 1 or more required fields are missing or have\
        \ an unsupported value)\n\n401\nAuthentication failed (invalid token format; token is expired)\n\
        \n403\nAuthentication succeeded but the user does not have sufficient privileges\n\n404\nSpecified\
        \ campaign was not found;  \nInvalid URL\n\n409\nSpecified campaign is disabled or already running"
      tags:
      - Campaigns
      parameters:
      - name: campaign_id
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: 200 OK
          content:
            application/json:
              example: "{\n  \"state\": “RUNNING”\n}"
      security:
      - bearerAuth: []
  /configapi/v3/campaign/stop/{campaign_id}:
    post:
      operationId: stop
      summary: Stop
      description: "This method stops an enabled campaign, first checking that the campaign is not disabled\
        \ or already stopped.\n\nNote: Manipulating campaign states requires the user to have an additional\
        \ \"Start campaigns and enable lists\" privilege.\n\nResponse Codes\n\nCode\nDescription\n\n200\n\
        Success\n\n400\nBad request (format not understood; 1 or more required fields are missing or have\
        \ an unsupported value)\n\n401\nAuthentication failed (invalid token format; token is expired)\n\
        \n403\nAuthentication succeeded but the user does not have sufficient privileges\n\n404\nSpecified\
        \ campaign was not found;  \nInvalid URL\n\n409\nSpecified campaign is disabled or already stopped"
      tags:
      - Campaigns
      parameters:
      - name: campaign_id
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: 200 OK
          content:
            application/json:
              example: "{\n  \"state\": “STOPPED”\n}"
      security:
      - bearerAuth: []
  /configapi/v3/campaign/bindList/{campaign_id}:
    post:
      operationId: bindList
      summary: Bind List
      description: "This method adds a list to the selected campaign.\n\nOnce added, an instance of the\
        \ list associated with this particular campaign is created. The ID of such an instance is returned\
        \ in the response body, together with the total number of records inside the original list.\n\n\
        Note: The instance's unique identifier can be further used to unbind or update the list, get campaign\
        \ results, or query a record from that list.\n\nNote: Manipulating calling lists associated with\
        \ a campaign requires the user to have an additional \"Start campaigns and enable lists\" privilege.\n\
        \nInput parameters\n\nName\nType\nRequired?\nPossible/Default Values\n\nlistId\nstring\nyes (can\
        \ be found in the Get Campaign  response)\n-\n\ninstanceName\nstring\nno\n-\n\nenabled\nboolean\n\
        no\nfalse (Default);  \ntrue\n\norder\ninteger, > 0\nno\n1(Default);  \n2,...\n\ndialingRatio\n\
        integer, > 0\nno\n1(Default);  \n2,...\n\nsortingOrder\nstring\nno\nNATURAL; (Default)  \nRANDOM;\
        \  \nCUSTOM\n\nsortingOrder.sortingFields.fieldName\nstring\nyes, if sortingOrder.type = custom\n\
        -\n\nsortingOrder.sortingFields.sortOrder\nstring\nyes, if sortingOrder.type = custom\nASC (Default);\
        \  \nDESC\n\nResponse Codes\n\nCode\nDescription\n\n200\nSuccess\n\n400\nBad request (format not\
        \ understood; 1 or more required fields are missing or have an unsupported value)\n\n401\nAuthentication\
        \ failed (invalid token format; token is expired)\n\n403\nAuthentication succeeded but the user\
        \ does not have sufficient privileges\n\n404\nSpecified campaign was not found;  \nSpecifed list\
        \ was not found;  \nInvalid URL"
      tags:
      - Campaigns
      parameters:
      - name: campaign_id
        in: path
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
            example:
              listId: 635DB66C-AA54-41C9-9F0E-AC3A9B5EDB2D
              instanceName: ''
              enabled: true
              order: 1
              dialingRatio: 1
              sortingOrder:
                type: CUSTOM
                sortingFields:
                - fieldName: Expected result
                  sortOrder: ASC
      responses:
        '200':
          description: 200 OK
          content:
            application/json:
              example:
                instanceId: DBA3A9B0-6CC4-11EE-807C-0800200C9A66
                totalRecords: 100
      security:
      - bearerAuth: []
  /configapi/v3/campaign/updateList/{campaign_id}:
    patch:
      operationId: updateList
      summary: Update List
      description: "This method changes the properties of an instance of a list in the associated campaign.\
        \ The instance is specified by its unique identifier, instanceID, returned in the response body\
        \ of the Get Campaign method (see here). Additionally, this method can reset an optional parameter\
        \ to its default value by passing \" \" or null to that parameter.\n\nBefore the list is updated,\
        \ its binding to the specified campaign is checked. If the instance is bound to the specified\
        \ campaign, the list is updated successfully.\n\nNote: Manipulating the content of calling lists\
        \ associated with a campaign requires the user to have an additional \"Start campaigns and enable\
        \ lists\" privilege.\n\nInput parameters\n\nName\nType\nRequired?\nPossible/Default Values\n\n\
        instanceId\nstring\nyes (can be found in the Get Campaign response)\n-\n\ninstanceName\nstring\n\
        no\n-\n\nenabled\nboolean\nno\nfalse (Default);  \ntrue\n\norder\ninteger, > 0\nno\n1(Default);\
        \  \n2,...\n\ndialingRatio\ninteger, > 0\nno\n1(Default);  \n2,...\n\nsortingOrder\nstring\nno\n\
        NATURAL; (Default)  \nRANDOM;  \nCUSTOM\n\nsortingOrder.sortingFields.fieldName\nstring\nyes,\
        \ if sortingOrder.type = custom\n-\n\nsortingOrder.sortingFields.sortOrder\nstring\nyes, if sortingOrder.type\
        \ = custom\nASC (Default);  \nDESC\n\nResponse Codes\n\nCode\nDescription\n\n200\nSuccess\n\n\
        400\nBad request (format not understood; 1 or more required fields are missing or have an unsupported\
        \ value)\n\n401\nAuthentication failed (invalid token format; token is expired)\n\n403\nAuthentication\
        \ succeeded but the user does not have sufficient privileges\n\n404\nSpecified campaign was not\
        \ found;  \nSpecified instance was not found;  \nInvalid URL\n\n409\nSpecified instance is not\
        \ bound to the selected campaign"
      tags:
      - Campaigns
      parameters:
      - name: campaign_id
        in: path
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
            example:
