      description: 'This method deletes the DNC list specified in the path variable, do_not_call_list_id.


        Once the DNC List is deleted, all records previously blocked by it in the associated campaign(s)
        become dialable again.


        Note: Archivation of DNC Lists and DNS List records is not supported in the Admin Portal, so no
        special considerations should be made for List API.'
