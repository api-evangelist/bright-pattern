  /configapi/v3/campaign/unbindList/{campaign_id}:
    post:
      operationId: unbindList
      summary: Unbind List
      description: "This method removes the instance of a list from the associated campaign. The instance\
        \ to be removed is specified by its unique identifier, instanceID, returned in the response body\
        \ of the Get Campaign method (see here).\n\nNote: Bright Pattern Contact Center solution supports\
        \ several voice campaign modes (see here). Depending on the mode of the associated campaign, the\
        \ active call behavior will differentiate as follows:\n\nProgressive, Predictive, or Automatic\
        \ (IVR) campaigns\nUpon instance deletion, all active, i.e. in a dialing state, within a script,\
        \ or connected to an agent, calls are dropped\n\nPreview campaigns\nUpon instance deletion, only\
        \ the calls not yet picked up by an agent are dropped. In-progress and connected calls are not\
        \ affected\n\nThe results of completed calls are archived and available for downloading in the\
        \ Contact Center Administrator application (see here). Interaction results for dropped calls are\
        \ not saved.\n\nInput parameters\n\nName\nType\nRequired?\nPossible/Default Values\n\ninstanceId\n\
        string\nyes (can be found in the Get Campaign  response)\n-\n\nResponse Codes\n\nCode\nDescription\n\
        \n200\nSuccess\n\n400\nBad request (format not understood; 1 or more required fields are missing\
        \ or have an unsupported value)\n\n401\nAuthentication failed (invalid token format; token is\
        \ expired)\n\n403\nAuthentication succeeded but the user does not have sufficient privileges\n\
        \n404\nSpecified campaign was not found;  \nSpecified instance was not found;  \nInvalid URL\n\
        \n409\nSpecified instance is not bound to the selected campaign"
      tags:
      - Campaigns
      parameters:
      - name: campaign_id
        in: path
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
            example:
              instanceId: DBA3A9B0-6CC4-11EE-807C-0800200C9A66
      responses:
        '200':
          description: 200 OK
      security:
      - bearerAuth: []
  /configapi/v3/campaign/getAllRecords/{campaign_id}:
    post:
      operationId: getAllRecords
      summary: Get All Records
      description: "This method returns a list of all records in an instance. The instance is specified\
        \ by its unique identifier, instanceID, returned in the response body of the Get Campaign method\
        \ (see here). Optionally, this method can also display request attempts made. The records are\
        \ returned and sorted by the standard MongoDB _id field.\n\nNote: To accommodate the display of\
        \ large numbers of list records, Bright Pattern Contact Solution utilizes Cursor-based pagination\
        \ (see here). The _id field is used as the \"cursor\" to reference the last served record.\n\n\
        Input parameters\n\nName\nType\nRequired?\nPossible/Default Values\n\ninstanceId\nstring\nyes\
        \ (can be found in the Get Campaign  response)\n-\n\nextractAttempts\nboolean\nno (if true,the\
        \ method returns the list of all attempts)\nfalse (Default);  \ntrue\n\nlimit\ninteger, ≤ 1000\n\
        yes (Specifies the maximum number of records per page when using cursor-based pagination)\n1...1000\n\
        \ncursor\nstring\nno (used for pagination)\nFirst request: null  \nSubsequent request: value received\
        \ in the response to the previous request\n\nResponse Codes\n\nCode\nDescription\n\n200\nSuccess\n\
        \n400\nBad request (format not understood; 1 or more required fields are missing or have an unsupported\
        \ value)\n\n401\nAuthentication failed (invalid token format; token is expired)\n\n403\nAuthentication\
        \ succeeded but the user does not have sufficient privileges\n\n404\nSpecified campaign was not\
        \ found;  \nInvalid URL\n\n409\nSpecified instance is not bound to the selected campaign"
      tags:
