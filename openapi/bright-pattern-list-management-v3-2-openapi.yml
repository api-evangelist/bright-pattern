  /configapi/v3/callinglist/get/{list_id}/{campaign_id}:
    post:
      operationId: queryARecordDeprecated
      summary: Query a Record DEPRECATED
      description: "This method returns a copy of an existing record in a calling list of an associated\
        \ campaign. The list is specified in the path variable, list_id, by its unique identifier returned\
        \ in the response body of the Get Campaign method (see here). The campaign is specified in the\
        \ path variable, campaign_id, by its unique identifier returned in the response body of the Get\
        \ Campaigns method (see here).\n\nThe record search is performed by its unique identifier, id,\
        \ returned in the response body of the Get All Records method (see here). If the list has been\
        \ added to the specified campaign more than once, the method returns an array of records. An error\
        \ is returned if a record with the specified id does not exist in the selected list.\n\nNote:\
        \ The response body contains the List Record JSON Object, defined by two sub-objects as follows:\n\
        \nentry object: contains a copy of the list entry\nfield names are retained as defined at list\
        \ creation\ncustom fields are returned with the prefix 'custom_' added to the name defined in\
        \ the Administrator Application\n\ntime and date field values are returned in UTC format\n\nstatusobject:\
        \ contains the campaign results for this specific record\nomitted if the list is not assigned\
        \ to the campaign or the campaign doesn't exist\n\nfield names are predefined\n\ncompleted field\
        \ is always present, while the other fields may be absent if the record was never called or never\
        \ reached an agent.\n\nNote: If a PHONE type field is defined as a key, the record value is checked\
        \ for a full match with the value stored in the database or the original source (if the data was\
        \ modified upon loading into the database).\n\nResponse Codes\n\nCode\nDescription\n\n200\nSuccess\n\
        \n400\nBad request (format not understood; 1 or more required fields are missing or have an unsupported\
        \ value)\n\n401\nAuthentication failed (invalid token format; token is expired)\n\n403\nAuthentication\
        \ succeeded but the user does not have sufficient privileges\n\n404\nSpecified List was not found;\
        \  \nSpecified Record was not found;  \nInvalid URL"
      tags:
      - Lists
      parameters:
      - name: list_id
        in: path
        required: true
        schema:
          type: string
      - name: campaign_id
        in: path
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
            example:
              id: N4
      responses:
        '200':
          description: 0 instances - 200 OK
          content:
            application/json:
              example:
                entry:
                  firstname: Mike
                  phone: '16505555555'
                  id: '2'
                  lastname: Miller
                  status: Platinum
      security:
      - bearerAuth: []
  /configapi/v3/callinglist/fetchAll/{list_id}:
    post:
      operationId: fetchAllRecords
      summary: Fetch All Records
      description: "This method returns a list of records from an existing calling list, specified in\
        \ the path variable, list_id.\n\nRecords are referenced by indexes, assigned to each record in\
        \ the list in sequential order of insertion (beginning from 0). All records with an index greater\
        \ than or equal to the requested record index, fromIndex, are returned in the response.\n\nNote:\
        \ The returned recordset contains JSON objects sorted by the index field. List Record JSON Object\
        \ contains:\n\nentry object: contains a copy of the list entry\n\nfield names are retained as\
        \ defined at list creation\n\nNote: This method doesn't return custom fields\n\nNote: The value\
        \ returned in the id field can be used to reference this record in further API requests.\n\nInput\
        \ parameters\n\nName\nType\nRequired?\nPossible/Default Values\n\nmaxSize\ninteger, ≤ 1000\nyes\
        \ (Specifies the maximum number of records per page when using cursor-based pagination)\n1...1000\n\
        \nfromIndex\nstring\nyes (specifies initial record index, used for pagination)\n-\n\nResponse\
        \ Codes\n\nCode\nDescription\n\n200\nSuccess\n\n400\nBad request (format not understood; 1 or\
        \ more required fields are missing or have an unsupported value)\n\n401\nAuthentication failed\
        \ (invalid token format; token is expired)\n\n403\nAuthentication succeeded but the user does\
        \ not have sufficient privileges\n\n404\nSpecified List was not found;  \nInvalid URL"
      tags:
      - Lists
      parameters:
      - name: list_id
        in: path
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
            example:
              fromIndex: 0
              maxSize: '100'
      responses:
        '200':
          description: 200 OK
          content:
            application/json:
              example: "[\n  {\n    \"entry\": {\n      \"firstname\": \"Graham\",\n      \"phone\": \"\
                16509999999\",\n      \"id\": \"1\",\n      \"lastname\": \"Smith\",\n      \"status\"\
                : \"Gold\"\n    },\n    \"index\": 0,\n    },\n  {\n    \"entry\": {\n      \"firstname\"\
                : \"Mike\",\n      \"phone\": \"16507777777\",\n      \"id\": \"2\",\n      \"lastname\"\
                : \"Miller\",\n      \"status\": \"Platinum\"\n    },\n    \"index\": 1,\n    },\n  {\n\
                \    \"entry\": {\n      \"firstname\": \"Katrina\",\n      \"phone\": \"16505555555\"\
                ,\n      \"id\": \"3\",\n      \"lastname\": \"Johnson\",\n      \"status\": \"Silver\"\
                \n    },\n    \"index\": 2,\n    },\n  {\n    \"entry\": {\n      \"firstname\": \"Jenny\"\
                ,\n      \"phone\": \"16502222222\",\n      \"id\": \"4\",\n      \"lastname\": \"Green\"\
                ,\n      \"status\": \"Gold\"\n    },\n    \"index\": 3, \n    }\n  }\n]"
      security:
      - bearerAuth: []
