  /configapi/v3/campaign/duplicateCampaign:
    post:
      operationId: duplicateCampaign
      summary: Duplicate Campaign
      description: 'This method creates a copy of the specified campaign.


        Note: This method is not supported for Outbound Messaging campaigns.


        The new campaign is always created disabled and in the STOPPED state.


        Calling lists are not inherited.


        Disposition IDs are newly generated, while disposition names and all other settings are inherited.


        Settings, dialing mode, teams, roles, caller ids, and calling hours are also inherited from the
        original campaign.


        Input parameters


        Name

        Type

        Required?

        Possible/Default Values


        name

        string

        no

        Clone of Source Campaign Name


        sourceCampaignId

        string

        yes

        -


        Response Codes


        Code

        Description


        200

        Success


        400

        Bad request (format not understood; 1 or more required fields are missing or have an unsupported
        value)


        401

        Authentication failed (invalid token format; token is expired)


        403

        Authentication succeeded but the user does not have sufficient privileges


        404

        Invalid URL or source campaign was not found


        409

        Duplicate name error


        422

        Not supported for Outbound Messaging campaigns'
      tags:
      - Campaigns
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
            example:
              name: Campaign name
              sourceCampaignId: 31002C90-7188-11EE-A565-0800200C9A66
      responses:
        '200':
          description: 200 OK
          content:
            application/json:
              example:
                id: 85389D39-E05C-4CE7-B36D-4401BEA52E14
      security:
      - bearerAuth: []
  /configapi/v3/callinglist/getAll/{list_id}/{campaign_id}:
    post:
      operationId: getAllRecordsDeprecated
      summary: Get All Records DEPRECATED
      description: "This method returns a list of records from a calling list associated with a campaign.\n\
        \nRecords are referenced by indexes, assigned to each record in the list in sequential order of\
        \ insertion (beginning from 0). All records with an index greater than or equal to the requested\
        \ record index, fromIndex, are returned in the response.\n\nNote: The returned recordset contains\
        \ JSON objects sorted by the index field. List Record JSON Object has two sub-objects, entry and\
        \ status, defined as follows:\n\nentry object: contains a copy of the list entry\n\nfield names\
        \ are retained as defined at list creation\n\ncustom fields are returned with the prefix 'custom_'\
        \ added to the name defined in the Administrator Application\n\nNote: The value returned in the\
        \ id field can be used to reference this record in further API requests.\n\nstatusobject: contains\
        \ the campaign results for this specific record\n\nomitted if the list is not assigned to the\
        \ campaign or the campaign doesn't exist\n\nfield names are predefined\n\ncompleted field is always\
        \ present, while the other fields may be absent if the record was never called or never reached\
        \ an agent.\n\nInput parameters\n\nName\nType\nRequired?\nPossible/Default Values\n\nmaxSize\n\
        integer, ≤ 1000\nyes (Specifies the maximum number of records per page when using cursor-based\
        \ pagination)\n1...1000\n\nfromIndex\nstring\nyes (specifies initial record index, used for pagination)\n\
        -\n\nResponse Codes\n\nCode\nDescription\n\n200\nSuccess\n\n400\nBad request (format not understood;\
        \ 1 or more required fields are missing or have an unsupported value)\n\n401\nAuthentication failed\
        \ (invalid token format; token is expired)\n\n403\nAuthentication succeeded but the user does\
        \ not have sufficient privileges\n\n404\nSpecified Campaign was not found;  \nSpecified List was\
        \ not found;  \nInvalid URL"
      tags:
      - Lists
      parameters:
      - name: list_id
        in: path
        required: true
        schema:
          type: string
      - name: campaign_id
        in: path
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
            example:
              fromIndex: 0
              maxSize: '100'
      responses:
        '200':
          description: 200 OK
          content:
            application/json:
              example:
              - entry:
                  firstname: Graham
                  phone: '16509999999'
                  id: '1'
                  lastname: Smith
                  status: Gold
                index: 0
                status:
                  globalInteractionID: 0B767156-D012-4F63-A3E2-12ACFC2F26EA
                  lastCallDuration: 0
                  lastDisposition: No disposition
                  totalAttempts: 1
