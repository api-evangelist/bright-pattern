  /configapi/v3/callinglist/getAll:
    post:
      operationId: getLists
      summary: Get Lists
      description: "This method returns all Calling Lists, sorted by the standard MongoDB _id field.\n\
        \nNote: To accommodate the display of large numbers of list records, Bright Pattern Contact Solution\
        \ utilizes Cursor-based pagination (see here). The _id field is used as the \"cursor\" to reference\
        \ the last served record.\n\nInput parameters\n\nName\nType\nRequired?\nPossible/Default Values\n\
        \nlimit\ninteger, ≤ 1000\nyes (Specifies the maximum number of records per page when using cursor-based\
        \ pagination)\n1...1000\n\ncursor\nstring\nno (used for pagination)\nFirst request: null  \nSubsequent\
        \ request: value received in the response to the previous request\n\nResponse Codes\n\nCode\n\
        Description\n\n200\nSuccess\n\n400\nBad request (limit exceeded; format not understood; 1 or more\
        \ required fields are missing or have an unsupported value)\n\n401\nAuthentication failed (invalid\
        \ token format; token is expired)\n\n403\nAuthentication succeeded but the user does not have\
        \ sufficient privileges\n\n404\nInvalid URL"
      tags:
      - Lists
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
            example:
              limit: 100
              cursor: 590e9abd4abbf1165862d342
      responses:
        '200':
          description: 200 OK
          content:
            application/json:
              example:
                next_cursor: 590e9abd4abbf1165862d342
                records:
                - id: 635DB66C-AA54-41C9-9F0E-AC3A9B5EDB2D
                  name: List 1.csv
                  formatId: 31002C90-7188-11EE-A565-0800200C9A66
                  formatName: format 1
