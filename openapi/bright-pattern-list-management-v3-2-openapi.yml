        \ fields are missing or have an unsupported value)\n\n401\nAuthentication failed (invalid token\
        \ format; token is expired)\n\n403\nAuthentication succeeded but the user does not have sufficient\
        \ privileges\n\n404\nSpecified link group was not found;  \nSpecifed campaign was not found; \
        \ \nInvalid URL\n\n422\nNot supported for Outbound Messaging campaigns"
